<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b5c50">
<link rel="apple-touch-icon" href="icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PropMatchRD">
<title>Panel de Administrador — PropMatchRD</title>
<link rel="stylesheet" href="styles.css">
<script src="fondo-premium.js" defer></script>
</head>
<body>
<div class="wrap" id="contenido">
  <div class="loading"><div class="spinner"></div>Verificando acceso…</div>
</div>

<script src="app.js"></script>
<script>
let CODIGO_ADMIN = '';

(async function () {
  CODIGO_ADMIN = obtenerParametro('codigo') || obtenerParametro('panelAdmin');
  if (!CODIGO_ADMIN) { mostrarError('contenido', 'Falta el código de acceso en el enlace.'); return; }
  await cargarPanel();
})();

async function cargarPanel() {
  try {
    const datos = await llamarApi({ panelAdmin: CODIGO_ADMIN });
    if (datos.error) { mostrarError('contenido', 'Acceso denegado.'); return; }
    pintarPanel(datos);
  } catch (err) {
    mostrarError('contenido', 'Ocurrió un problema de conexión. Intenta de nuevo en unos minutos.');
  }
}

function pintarPanel(datos) {
  document.getElementById('contenido').innerHTML =
    '<h1 style="text-align:center">🔐 Panel de Administrador</h1>' +
    '<p style="text-align:center;color:var(--text-muted);font-size:13px">Solo tú deberías tener este link — no lo compartas.</p>' +

    '<div class="stat-grid">' +
    '<div class="stat"><span class="num">' + datos.kpis.compradoresActivos + '</span><span class="label">Compradores activos</span></div>' +
    '<div class="stat"><span class="num">' + datos.alquiler.activas + '</span><span class="label">🔑 Alquileres activos</span></div>' +
    '<div class="stat"><span class="num">' + datos.kpis.compradoresHoy + '</span><span class="label">Compradores hoy</span></div>' +
    '<div class="stat"><span class="num">' + datos.kpis.cierresTotales + '</span><span class="label">Cierres totales</span></div>' +
    '<div class="stat"><span class="num">' + datos.kpis.agentesActivos + '</span><span class="label">Agentes activos</span></div>' +
    '</div>' +

    '<div class="card"><h3>📊 De las mejoras de hoy</h3>' +
    '<p style="font-size:13px">Satisfacción (¿les gustó la propiedad?): <b>' + (datos.kpis.satisfaccionPct !== null ? datos.kpis.satisfaccionPct + '%' : 'Aún sin datos') + '</b></p>' +
    '<p style="font-size:13px">Zona con más compradores activos: <b>' + datos.kpis.zonaMasActiva + '</b></p>' +
    (datos.kpis.agentesConAlertasFraude > 0
      ? '<p style="font-size:13px;color:#e4572e">🚨 ' + datos.kpis.agentesConAlertasFraude + ' agente(s) con visitas negadas por clientes (' + datos.kpis.totalVisitasNegadas + ' en total) — revisar en la hoja Agentes.</p>'
      : '<p style="font-size:13px;color:#0f7a6b">✅ Ningún agente con visitas negadas por clientes.</p>') +
    '</div>' +

    '<div class="card"><h3>🎖️ Embajadores</h3>' +
    '<p style="font-size:13px">Total registrados: <b>' + datos.embajadores.total + '</b> · Activos: <b>' + datos.embajadores.activos + '</b></p>' +
    '<p style="font-size:13px">Comisión acumulada (histórico): <b>' + formatoRD(datos.embajadores.comisionAcumuladaTotal) + '</b></p>' +
    '</div>' +

    (datos.confirmacionesCierrePendientes && datos.confirmacionesCierrePendientes.length
      ? '<div class="card"><h3>👋 Esperando confirmación de cierre (' + datos.confirmacionesCierrePendientes.length + ')</h3>' +
        '<p style="font-size:13px;color:var(--text-muted)">Se les preguntó directamente si llegaron a comprar — todavía no han respondido.</p>' +
        datos.confirmacionesCierrePendientes.map(c =>
          '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)">' +
          '<span style="font-size:13px">' + escaparHtml(c.nombre) + ' <span style="color:var(--text-muted)">— preguntado el ' + c.fechaPregunta + '</span></span>' +
          '<a href="' + c.linkWhatsApp + '" target="_blank" class="btn btn-sm" style="background:#25D366;color:white;text-decoration:none">💬 Recordar</a>' +
          '</div>'
        ).join('') + '</div>'
      : '') +

    (datos.conexionesDirectasPendientes && datos.conexionesDirectasPendientes.length
      ? '<div class="card"><h3>🤝 Conexiones Directas esperando respuesta (' + datos.conexionesDirectasPendientes.length + ')</h3>' +
        '<p style="font-size:13px;color:var(--text-muted)">Comprador y propietario conectando sin agente — alguna de las 2 partes todavía no respondió.</p>' +
        datos.conexionesDirectasPendientes.map(c =>
          '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)">' +
          '<span style="font-size:13px">' + escaparHtml(c.idPropiedad) + ' <span style="color:var(--text-muted)">— iniciada por ' + escaparHtml(c.iniciadaPor) + ' el ' + c.fecha + ' · esperando a ' + escaparHtml(c.esperandoA) + '</span></span>' +
          (c.linkWhatsApp ? '<a href="' + c.linkWhatsApp + '" target="_blank" class="btn btn-sm" style="background:#25D366;color:white;text-decoration:none">💬 Recordar</a>' : '') +
          '</div>'
        ).join('') + '</div>'
      : '') +

    '<div class="card"><h3>🔑 Alquiler</h3>' +
    '<p style="font-size:13px">Solicitudes hoy: <b>' + datos.alquiler.solicitudesHoy + '</b> · Activas: <b>' + datos.alquiler.activas + '</b></p>' +
    '<p style="font-size:13px">Cierres: <b>' + datos.alquiler.cierres + '</b> · Comisión generada: <b>' + formatoRD(datos.alquiler.comisionGenerada) + '</b></p>' +
    '</div>' +

    '<div class="card"><h3>⏳ Pendientes</h3>' +
    '<p style="font-size:13px">📄 Acuerdos de Comisión sin enviar: <b>' + datos.pendientes.acuerdosComision + '</b></p>' +
    '<p style="font-size:13px">📊 Links de Panel sin enviar: <b>' + datos.pendientes.linksPanel + '</b></p>' +
    '<p style="font-size:13px">💰 Comisiones por pagar (venta + alquiler): <b>' + datos.pendientes.comisionesPorPagar + '</b></p>' +
    '<p style="font-size:13px">⏰ Próximas a vencer: <b style="color:#b8860b">' + datos.pendientes.comisionesProximasVencer + '</b> · 🚨 Ya vencidas: <b style="color:#e4572e">' + datos.pendientes.comisionesYaVencidas + '</b></p>' +
    '</div>' +

    '<div class="card"><h3>📋 Ver detalles</h3>' +
    '<p style="font-size:12px;color:var(--text-muted)">No se cargan al abrir el Panel (para que siga siendo rápido) — solo al presionar cada botón.</p>' +
    '<button class="btn btn-outline" style="width:100%;margin-bottom:6px" onclick="verDetalle(\'verComentariosVisitas\')">💬 Comentarios recientes de visitas</button>' +
    '<button class="btn btn-outline" style="width:100%;margin-bottom:6px" onclick="verDetalle(\'verAgentesPendientesVerificar\')">🔎 Agentes pendientes de verificar</button>' +
    '<button class="btn btn-outline" style="width:100%;margin-bottom:6px" onclick="verDetalle(\'verSolicitudesAyuda\')">🆘 Solicitudes de ayuda recientes</button>' +
    '<button class="btn btn-outline" style="width:100%" onclick="verDetalle(\'verAlertasFraude\')">🚨 Detalle de alertas de fraude</button>' +
    '<div id="resultadoDetalle" style="margin-top:10px"></div></div>' +

    '<div class="card"><h3>⚡ Redistribuir compradores por zona</h3>' +
    '<p style="font-size:12px;color:var(--text-muted)">Pone a todos los compradores sin asignar de una zona a competir contra todos los agentes elegibles de esa misma zona.</p>' +
    '<input type="text" id="inputZonaRedistribuir" placeholder="Ej. Distrito Nacional" style="width:100%;margin-bottom:8px">' +
    '<button class="btn btn-primary" style="width:100%" onclick="redistribuirZona()">⚡ Redistribuir esta zona</button>' +
    '<p id="mensajeZona" style="font-size:13px;margin-top:8px"></p></div>' +

    '<div class="card"><h3>Acciones rápidas</h3>' +
    '<button class="btn btn-primary" style="width:100%;margin-bottom:8px" onclick="ejecutarAccionAdmin(\'enviarAcuerdosPendientes\')">📄 Enviar Acuerdos de Comisión pendientes</button>' +
    '<button class="btn btn-primary" style="width:100%;margin-bottom:8px" onclick="ejecutarAccionAdmin(\'enviarPanelesPendientes\')">📊 Enviar links de Panel pendientes</button>' +
    '<button class="btn btn-outline" style="width:100%;margin-bottom:8px" onclick="ejecutarAccionAdmin(\'verificarIntegridad\')">🛡️ Verificar integridad de datos</button>' +
    '<button class="btn btn-outline" style="width:100%" onclick="ejecutarAccionAdmin(\'actualizarDashboard\')">📈 Actualizar Dashboard</button>' +
    '</div>' +

    '<div id="resultadoAccion"></div>' +

    '<p class="footer-note">Para acciones más avanzadas, usa el menú "🏠 PropMatchRD" desde el Google Sheet.</p>';
}

async function abrirYMarcarEnviado(idx) {
  const item = window.LINKS_PENDIENTES_ACTUALES[idx];
  if (!item) return;
  window.open(item.link, '_blank');

  const elemento = document.getElementById('itemPendiente_' + idx);
  if (elemento) elemento.style.opacity = '0.4';

  try {
    await ejecutarAccion({ panelAdmin: CODIGO_ADMIN, accion: 'marcarEnviado', tipo: item.tipo, sheetKey: item.sheetKey, id: item.id });
    if (elemento) elemento.remove();
  } catch (e) {
    if (elemento) elemento.style.opacity = '1';
  }
}

async function verDetalle(accion) {
  const cont = document.getElementById('resultadoDetalle');
  cont.innerHTML = '<p style="font-size:13px">Cargando…</p>';
  try {
    const datos = await ejecutarAccion({ panelAdmin: CODIGO_ADMIN, accion: accion });
    if (datos.error) { cont.innerHTML = '<p style="font-size:13px;color:#e4572e">⚠️ ' + datos.mensaje + '</p>'; return; }

    let filas = [];
    if (accion === 'verComentariosVisitas') {
      filas = (datos.comentarios || []).map(function (c) {
        const opinion = c.leGusto === 'Sí' ? '👍 Le gustó' : '👎 No le gustó';
        return '<div style="border-bottom:1px solid var(--line);padding:6px 0;font-size:13px">' +
          '<b>' + c.id + '</b> (' + c.tipo + ') · Agente: ' + c.agente + '<br>' + opinion + ' · ' + (c.fecha ? new Date(c.fecha).toLocaleDateString('es-DO') : '—') + '</div>';
      });
      if (!filas.length) filas = ['<p style="font-size:13px">Sin comentarios todavía.</p>'];
    } else if (accion === 'verAgentesPendientesVerificar') {
      filas = (datos.agentes || []).map(function (a) {
        return '<div style="border-bottom:1px solid var(--line);padding:6px 0;font-size:13px"><b>' + a.id + '</b> — ' + escaparHtml(a.nombre) + ' · ' + (a.telefono || 'sin teléfono') + '</div>';
      });
      if (!filas.length) filas = ['<p style="font-size:13px">✅ No hay agentes pendientes de verificar.</p>'];
    } else if (accion === 'verSolicitudesAyuda') {
      filas = (datos.solicitudes || []).map(function (s) {
        return '<div style="border-bottom:1px solid var(--line);padding:6px 0;font-size:13px"><b>' + s.id + '</b> — ' + escaparHtml(s.nombre) + '<br>' + s.tipo + ' · ' + (s.fecha ? new Date(s.fecha).toLocaleDateString('es-DO') : '—') + '</div>';
      });
      if (!filas.length) filas = ['<p style="font-size:13px">Sin solicitudes de ayuda recientes.</p>'];
    } else if (accion === 'verAlertasFraude') {
      filas = (datos.alertas || []).map(function (a) {
        return '<div style="border-bottom:1px solid var(--line);padding:6px 0;font-size:13px"><b>' + a.id + '</b> — ' + escaparHtml(a.nombre) + ' · <span style="color:#e4572e">' + a.cantidad + ' visita(s) negada(s)</span></div>';
      });
      if (!filas.length) filas = ['<p style="font-size:13px">✅ Ningún agente con visitas negadas.</p>'];
    }
    cont.innerHTML = filas.join('');
  } catch (e) {
    cont.innerHTML = '<p style="font-size:13px;color:#e4572e">⚠️ Ocurrió un problema de conexión.</p>';
  }
}

async function redistribuirZona() {
  const zona = document.getElementById('inputZonaRedistribuir').value.trim();
  const msj = document.getElementById('mensajeZona');
  if (!zona) { msj.textContent = '⚠️ Escribe una zona antes de continuar.'; return; }
  msj.textContent = 'Procesando…';
  try {
    const datos = await ejecutarAccion({ panelAdmin: CODIGO_ADMIN, accion: 'redistribuirZona', zona: zona });
    if (datos.error) { msj.textContent = '⚠️ ' + datos.mensaje; return; }
    msj.textContent = '✅ ' + datos.procesados + ' de ' + datos.totalCompradores + ' comprador(es) de "' + zona + '" ahora compiten entre ' + datos.totalAgentes + ' agente(s).';
    await cargarPanel();
  } catch (e) {
    msj.textContent = '⚠️ Ocurrió un problema de conexión.';
  }
}

async function ejecutarAccionAdmin(accion) {
  const contenedor = document.getElementById('resultadoAccion');
  contenedor.innerHTML = '<div class="card"><p>Procesando…</p></div>';
  try {
    const datos = await ejecutarAccion({ panelAdmin: CODIGO_ADMIN, accion: accion });
    if (datos.error) { contenedor.innerHTML = '<div class="alert">⚠️ ' + datos.mensaje + '</div>'; return; }

    if (accion === 'verificarIntegridad') {
      contenedor.innerHTML = datos.problemas.length
        ? '<div class="alert">⚠️ ' + datos.problemas.length + ' problema(s):<br>' + datos.problemas.slice(0, 10).join('<br>') + '</div>'
        : '<div class="alert success">✅ Todo en orden — sin problemas de integridad.</div>';
      return;
    }

    if (accion === 'actualizarDashboard') {
      contenedor.innerHTML = '<div class="alert success">✅ ' + datos.mensaje + '</div>';
      return;
    }

    // enviarAcuerdosPendientes / enviarPanelesPendientes
    const r = datos.resultado;
    window.LINKS_PENDIENTES_ACTUALES = r.links || [];
    if (r.total === 0) {
      contenedor.innerHTML = '<div class="alert success">✅ No había ningún pendiente.</div>';
    } else if (r.enviados > 0) {
      contenedor.innerHTML = '<div class="alert success">✅ ' + r.enviados + ' de ' + r.total + ' enviados automáticamente (API activa).</div>';
    } else {
      contenedor.innerHTML = '<div class="card"><h3>' + r.total + ' pendiente(s) — toca cada uno para enviar</h3>' +
        r.links.map((l, idx) => '<p id="itemPendiente_' + idx + '"><button class="btn btn-sm" style="background:#25D366;color:white;border:none" onclick="abrirYMarcarEnviado(' + idx + ')">💬 ' + escaparHtml(l.nombre) + (l.etiqueta ? ' (' + l.etiqueta + ')' : '') + '</button></p>').join('') +
        '</div>';
    }
    await cargarPanel();
  } catch (e) {
    contenedor.innerHTML = '<div class="alert">⚠️ Ocurrió un problema de conexión.</div>';
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b5c50">
<link rel="apple-touch-icon" href="icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PropMatchRD">
<title>Tu Panel de Embajador — PropMatchRD</title>
<link rel="stylesheet" href="styles.css">
<script src="fondo-premium.js" defer></script>
</head>
<body>
<div class="wrap" id="contenido"></div>

<script src="app.js"></script>
<script>
  document.getElementById('contenido').innerHTML = construirEsqueletoCarga(3);
async function cargarPanelEmbajador() {
  if (mostrarMantenimientoSiAplica('contenido')) return;
  const codigo = obtenerParametro('codigo') || obtenerParametro('embajador');
  if (!codigo) { mostrarError('contenido', 'Falta tu código de acceso en el enlace.'); return; }
  guardarCodigoRecordado('embajador', codigo); // automatización: la próxima vez, index.html ya lo recuerda

  try {
    const datos = await llamarApi({ embajador: codigo });
    if (datos.error) { mostrarError('contenido', datos.mensaje); return; }
    pintarPanel(datos);
  } catch (err) {
    mostrarError('contenido', 'Ocurrió un problema de conexión. Intenta de nuevo en unos minutos.');
  }
}

async function actualizarPanelEmbajadorManual() {
  const btn = document.getElementById('btnActualizarPanelEmbajador');
  if (btn) { btn.textContent = '⏳ Actualizando…'; btn.disabled = true; }
  await cargarPanelEmbajador();
}

cargarPanelEmbajador();

function pintarPanel(datos) {
  const pasosHtml = datos.pasos.map((p) => {
    const icono = p.hecho ? '✓' : '○';
    const clase = p.hecho ? 'hecho' : '';
    return '<div class="ruta-paso ' + clase + '"><div class="ruta-nodo">' + icono + '</div><div class="ruta-texto">' + p.titulo + '</div></div>';
  }).join('');

  document.getElementById('contenido').innerHTML =
    '<div style="display:flex;justify-content:flex-end"><button id="btnActualizarPanelEmbajador" onclick="actualizarPanelEmbajadorManual()" style="background:var(--teal);color:white;border:none;border-radius:100px;padding:6px 12px;font-size:12px;cursor:pointer">🔄 Actualizar</button></div>' +
    '<div style="text-align:center"><span class="badge gold" style="background:#b8860b">Nivel ' + datos.nivel + '</span></div>' +
    '<h1 style="text-align:center">Hola ' + escaparHtml(datos.nombre) + '</h1>' +
    '<p style="text-align:center;font-family:var(--font-mono);color:var(--text-muted)">Tu código: ' + datos.codigoReferido + '</p>' +

    '<div class="card" style="text-align:center"><h3>Tu nivel de desempeño</h3>' +
    construirGraficoGauge(datos.score, '#b8860b', 110) +
    '<p style="font-size:13px;color:var(--text-muted);margin-top:6px">Se calcula con tu tasa de conversión, validación y actividad reciente — no es un premio por antigüedad, sino por resultados.</p></div>' +

    '<div class="stat-grid">' +
    '<div class="stat"><span class="num">' + datos.kpis.totalReferidos + '</span><span class="label">Referidos totales</span></div>' +
    '<div class="stat"><span class="num">' + ((datos.referidos || []).filter(r => r.tipo === 'Alquiler').length) + '</span><span class="label">🔑 Buscan alquiler</span></div>' +
    '<div class="stat"><span class="num">' + datos.kpis.validados + '</span><span class="label">Validados</span></div>' +
    '<div class="stat"><span class="num">' + datos.kpis.cerrados + '</span><span class="label">Compras completadas</span></div>' +
    '<div class="stat"><span class="num">' + formatoRD(datos.kpis.comisionAcumulada) + '</span><span class="label">Comisión cobrada</span></div>' +
    '</div>' +

    (datos.kpis.comisionReservadaMax > 0
      ? '<div class="alert info">Tienes entre ' + formatoRD(datos.kpis.comisionReservadaMin) + ' y ' + formatoRD(datos.kpis.comisionReservadaMax) + ' en comisión <b>reservada</b> — de referidos que ya están en proceso pero aún no han comprado.</div>'
      : '') +

    '<div class="card"><h3>Tu embudo de referidos</h3>' +
    construirGraficoBarras([
      { etiqueta: 'Referidos totales', valor: datos.kpis.totalReferidos, color: '#0f7a6b' },
      { etiqueta: 'Validados', valor: datos.kpis.validados, color: '#1a73e8' },
      { etiqueta: 'Compras completadas', valor: datos.kpis.cerrados, color: '#e4572e' }
    ]) + '</div>' +

    (datos.referidos && datos.referidos.length
      ? '<div class="card"><h3>Tus referidos</h3>' +
        '<p style="font-size:13px;color:var(--text-muted)">Por privacidad, no mostramos teléfono, correo ni presupuesto de tus referidos.</p>' +
        datos.referidos.map(r => {
          let comisionTexto = '<span style="color:#999">Aún sin estimar</span>';
          if (r.comisionPagada) { comisionTexto = '<b style="color:#0f7a6b">✅ ' + formatoRD(r.comisionExacta) + ' — Pagada</b>'; }
          else if (r.comisionExacta !== null) {
            comisionTexto = '<b style="color:#1a73e8">' + formatoRD(r.comisionExacta) + ' — Aprobada, pendiente de pago</b>';
          } else if (r.comisionMin !== null) {
            comisionTexto = '<b style="color:#b8860b">' + formatoRD(r.comisionMin) + ' - ' + formatoRD(r.comisionMax) + ' (estimado)</b>';
          }
          return '<div style="border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">' +
            '<b style="font-size:15px">' + escaparHtml(r.nombre) + '</b>' +
            '<span style="font-size:13px;background:var(--sand-deep);padding:2px 10px;border-radius:100px">' + r.tipo + '</span>' +
            '</div>' +
            '<div style="font-size:13px;color:var(--text-muted);margin-bottom:4px">' + r.estado + ' · ' + new Date(r.fecha).toLocaleDateString('es-DO') + '</div>' +
            '<div style="font-size:13px">' + comisionTexto + '</div>' +
            '</div>';
        }).join('') +
        '</div>'
      : '') +

    '<div class="card"><h3>Cómo se calcula tu comisión</h3>' +
    '<p style="font-size:13px">Cada vez que uno de tus referidos compra, ganas dinero — y esto <b>nunca le quita nada al agente</b>, ' +
    'porque sale de una parte que la plataforma aparta especialmente para ti.</p>' +
    '<p style="font-size:13px">Ahora mismo, ganas el <b>' + datos.comision.pctEmbajadorEfectivo + '%</b> de esa parte' +
    (datos.comision.calificaParaBono
      ? ' — ya incluye tu bono por buen desempeño, porque tu nivel está en ' + datos.score + ' (se necesita ' + datos.comision.scoreMinimoBono + ' o más).</p>'
      : '. Si tu nivel sube a ' + datos.comision.scoreMinimoBono + ' o más, ganas un ' + datos.comision.pctBonoAltoDesempeno + '% extra. Hoy tu nivel es ' + datos.score + '.</p>') +

    '<h4 style="margin-bottom:6px">Calcula tu comisión estimada</h4>' +
    '<div class="code-input"><input type="text" id="inputMontoVenta" value="5000000" inputmode="numeric">' +
    '<button class="btn btn-primary btn-sm" onclick="calcularComisionEstimada()">🧮 Calcular</button></div>' +
    '<p id="resultadoCalculadora" style="font-size:15px;margin-top:10px;font-weight:600"></p></div>' +

    (datos.mensajePersonalizado
      ? '<div class="card"><h3>Tu mensaje sugerido</h3>' +
        '<p style="font-size:13px">Un mensaje ya redactado para el canal que elegiste — cópialo y compártelo cuando quieras.</p>' +
        '<p id="mensajeIA" style="background:#fff8e6;padding:12px;border-radius:6px;font-style:italic">' + datos.mensajePersonalizado + '</p>' +
        '<button class="btn btn-outline btn-sm" onclick="copiarMensaje()">📋 Copiar mensaje</button> ' +
        '<button class="btn btn-outline btn-sm" onclick="regenerarMensaje()" id="btnRegenerar">🔄 Generar otro</button>' +
        '<p id="copiadoOk" style="font-size:13px;margin-top:6px"></p></div>'
      : '') +

    (datos.premium.activo
      ? '<div class="card" style="border:2px solid #b8860b;text-align:center">' +
        '<h3>⭐ Membresía Premium activa</h3>' +
        '<p style="font-size:13px">Vigente hasta <b>' + new Date(datos.premium.fechaVencimiento).toLocaleDateString('es-DO') + '</b></p>' +
        '<p style="font-size:13px">Ganas <b>' + datos.premium.pctPoolPremium + '%</b> del fondo de referidos garantizado (en vez de ' + datos.premium.pctPoolNormal + '%).</p>' +
        '</div>'
      : '<div class="card" style="border:2px solid #b8860b">' +
        '<h3>⭐ Membresía Premium — RD$' + datos.premium.cuota + '/mes</h3>' +
        '<p style="font-size:13px;color:var(--text-muted);margin-bottom:8px">Una inversión mensual pequeña que se recupera fácilmente con solo un referido exitoso al mes.</p>' +
        '<ul style="font-size:13px;padding-left:18px">' +
        '<li>Ganas <b>' + datos.premium.pctPoolPremium + '%</b> del fondo de referidos garantizado (en vez de ' + datos.premium.pctPoolNormal + '%) — sin importar tu nivel.</li>' +
        '<li>Bono de alto desempeño desde un nivel de solo ' + datos.premium.scoreMinimoBonoPremium + ' (en vez de un nivel más alto).</li>' +
        '<li>Insignia Premium visible.</li>' +
        '</ul>' +
        (datos.premium.pagoReportado
          ? '<p style="font-size:13px;color:#1a73e8">📨 Tu solicitud está en revisión — te confirmamos apenas se apruebe.</p>'
          : ((datos.cuentaBancariaPlataforma ? '<p style="font-size:13px;color:var(--text-muted)">1) Transfiere RD$' + datos.premium.cuota + ' a: <b>' + datos.cuentaBancariaPlataforma + '</b><br>2) Envía tu solicitud abajo — la aprobamos apenas confirmemos el pago.</p>' : '') +
             '<button class="btn btn-primary" onclick="reportarPagoPremiumEmbajador()">⭐ Enviar solicitud de membresía</button><span id="premiumMsjEmb" style="font-size:13px;margin-left:8px"></span>')) +
        '</div>') +

    '<div class="card"><h3>💳 Cuenta para recibir tu comisión</h3>' +
    '<p style="font-size:13px">El pago se coordina directamente contigo — esto solo nos dice a dónde transferir cuando se apruebe una comisión.</p>' +
    '<label style="font-size:13px;color:var(--text-muted)">Banco</label>' +
    '<input type="text" id="inputCuentaBanco" value="' + (datos.cuentaBanco || '') + '" placeholder="Ej. Banco Popular Dominicano" style="width:100%;margin-bottom:8px">' +
    '<label style="font-size:13px;color:var(--text-muted)">Tipo de cuenta</label>' +
    '<select id="inputCuentaTipo" style="width:100%;margin-bottom:8px">' +
    '<option value="Ahorros"' + (datos.cuentaTipo === 'Ahorros' ? ' selected' : '') + '>Ahorros</option>' +
    '<option value="Corriente"' + (datos.cuentaTipo === 'Corriente' ? ' selected' : '') + '>Corriente</option>' +
    '</select>' +
    '<label style="font-size:13px;color:var(--text-muted)">Número de cuenta</label>' +
    '<input type="text" id="inputCuentaNumero" value="' + (datos.cuentaNumero || '') + '" style="width:100%;margin-bottom:8px">' +
    '<label style="font-size:13px;color:var(--text-muted)">Nombre del titular</label>' +
    '<input type="text" id="inputCuentaTitular" value="' + (datos.cuentaTitular || '') + '" style="width:100%;margin-bottom:8px">' +
    '<button class="btn btn-primary btn-sm" onclick="guardarCuentaBancaria()">💾 Guardar</button>' +
    '<p id="mensajeCuenta" style="font-size:13px;margin-top:6px"></p></div>' +

    '<div class="card"><h3>Tu progreso</h3><div class="ruta">' + pasosHtml + '</div></div>' +

    '<p class="footer-note">Comparte tu enlace personal para seguir generando referidos.</p>';

  window.DATOS_COMISION_ACTUAL = datos.comision;
}

function calcularComisionEstimada() {
  const monto = Number(document.getElementById('inputMontoVenta').value.replace(/[^0-9]/g, '')) || 0;
  const c = window.DATOS_COMISION_ACTUAL;
  if (!c || monto <= 0) {
    document.getElementById('resultadoCalculadora').textContent = 'Ingresa un monto válido.';
    return;
  }
  const pool = monto * (c.pctBasePool / 100);
  const ganancia = pool * (c.pctEmbajadorEfectivo / 100);
  document.getElementById('resultadoCalculadora').innerHTML =
    'Con una venta de ' + formatoRD(monto) + ', ganarías aproximadamente <span style="color:#b8860b">' + formatoRD(Math.round(ganancia)) + '</span>.';
}

async function copiarMensaje() {
  const texto = document.getElementById('mensajeIA').textContent;
  try {
    await navigator.clipboard.writeText(texto);
    document.getElementById('copiadoOk').textContent = '¡Copiado!';
  } catch (e) {
    document.getElementById('copiadoOk').textContent = 'No se pudo copiar automáticamente — selecciona el texto manualmente.';
  }
}

async function regenerarMensaje() {
  const codigo = obtenerParametro('codigo') || obtenerParametro('embajador');
  const boton = document.getElementById('btnRegenerar');
  boton.disabled = true;
  boton.textContent = 'Generando…';
  try {
    const datos = await ejecutarAccion({ embajador: codigo, accion: 'regenerarMensaje' });
    if (datos.error) {
      document.getElementById('copiadoOk').textContent = '⚠️ ' + datos.mensaje;
      boton.disabled = false;
      boton.textContent = 'Generar otro';
      return;
    }
    pintarPanel(datos);
  } catch (e) {
    document.getElementById('copiadoOk').textContent = 'No se pudo generar un mensaje nuevo. Intenta de nuevo.';
    boton.disabled = false;
    boton.textContent = 'Generar otro';
  }
}

async function guardarCuentaBancaria() {
  const codigo = obtenerParametro('codigo') || obtenerParametro('embajador');
  const banco = document.getElementById('inputCuentaBanco').value.trim();
  const tipo = document.getElementById('inputCuentaTipo').value;
  const numero = document.getElementById('inputCuentaNumero').value.trim();
  const titular = document.getElementById('inputCuentaTitular').value.trim();
  const msj = document.getElementById('mensajeCuenta');
  if (!banco || !numero) { msj.textContent = '⚠️ El banco y el número de cuenta son obligatorios.'; return; }
  msj.textContent = 'Guardando…';
  try {
    const datos = await ejecutarAccion({ embajador: codigo, accion: 'actualizarCuentaBancaria', banco: banco, tipo: tipo, numero: numero, titular: titular });
    msj.textContent = datos.error ? '⚠️ ' + datos.mensaje : '✅ Guardado.';
  } catch (e) {
    msj.textContent = '⚠️ Ocurrió un problema de conexión.';
  }
}

async function reportarPagoPremiumEmbajador() {
  const codigo = obtenerParametro('codigo') || obtenerParametro('embajador');
  const msj = document.getElementById('premiumMsjEmb');
  msj.textContent = 'Enviando…';
  try {
    const datos = await ejecutarAccion({ embajador: codigo, accion: 'reportarPagoPremium' });
    if (datos.error) { msj.textContent = '⚠️ ' + datos.mensaje; return; }
    pintarPanel(datos);
  } catch (e) {
    msj.textContent = '⚠️ Ocurrió un problema de conexión.';
  }
}
</script>
</body>
</html>

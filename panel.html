<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b5c50">
<link rel="apple-touch-icon" href="icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PropMatchRD">
<title>Tu panel — PropMatchRD</title>
<link rel="stylesheet" href="styles.css">
<script src="fondo-premium.js" defer></script>
</head>
<body>
<div class="wrap" id="contenido"></div>

<div class="nav-inferior">
  <button onclick="irASeccion('ancla-compradores')"><span class="icono">🏠</span>Compradores</button>
  <button onclick="irASeccion('ancla-alquileres')"><span class="icono">🔑</span>Alquileres</button>
  <button onclick="irASeccion('ancla-comisiones')"><span class="icono">💰</span>Comisiones</button>
  <button onclick="irASeccion('ancla-cuenta')"><span class="icono">⚙️</span>Mi cuenta</button>
</div>

<script src="app.js"></script>
<script>
  document.getElementById('contenido').innerHTML = construirEsqueletoCarga(4);
  let CODIGO_PANEL = '';

  function irASeccion(idAncla) {
    const el = document.getElementById(idAncla);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  async function actualizarPanelManual() {
    const btn = document.getElementById('btnActualizarPanel');
    if (btn) { btn.textContent = '⏳ Actualizando…'; btn.disabled = true; }
    await cargarPanel();
  }

  async function cargarPanel(idContacto) {
    if (mostrarMantenimientoSiAplica('contenido')) return;
    const params = { panel: CODIGO_PANEL };
    if (idContacto) params.contacto = idContacto;
    const datos = await llamarApi(params);
    if (datos.error) { mostrarError('contenido', datos.mensaje); return; }
    guardarCodigoRecordado('agente', CODIGO_PANEL); // automatización: la próxima vez, index.html ya lo recuerda

    window.TODOS_LOS_COMPRADORES = datos.compradores;
    const filas = datos.compradores.map(construirTarjetaComprador).join('');

    const disponible = datos.disponibilidad !== 'No';
    const atiendeAlquileres = datos.atiendeAlquileres === 'Sí';

    document.getElementById('contenido').innerHTML =
      '<div class="barra-sticky">' +
      '<div class="stats-mini"><span>🏠 <b>' + datos.kpis.compradoresActivos + '</b></span><span>🔑 <b>' + (datos.kpis.alquileresActivos || 0) + '</b></span><span>✅ <b>' + datos.kpis.cierresConfirmados + '</b></span></div>' +
      '<button onclick="actualizarPanelManual()" id="btnActualizarPanel">🔄 Actualizar</button>' +
      '</div>' +
      (datos.mensajeContacto ? datos.mensajeContacto : '') +
      '<div style="text-align:center"><span class="badge">' + datos.nivel + '</span></div>' +
      '<h1 style="text-align:center">Hola ' + datos.nombre + '</h1>' +
      (datos.tipoRegistro === 'Empresa'
        ? '<p style="text-align:center;font-size:13px;color:var(--text-muted)">🏢 Empresa inmobiliaria' + (datos.nombreRepresentante ? ' · Representante: ' + datos.nombreRepresentante : '') + '</p>'
        : '') +
      (datos.ranking
        ? '<p style="text-align:center;font-size:13px;color:var(--teal-deep)">🏆 Puesto <b>#' + datos.ranking.posicion + '</b> de ' + datos.ranking.totalAgentes + ' agentes</p>'
        : '') +
      (datos.comisionPersonalizada && (datos.comisionPersonalizada.venta || datos.comisionPersonalizada.alquiler)
        ? '<p style="text-align:center;font-size:12px;color:#b8860b">💼 Tienes una comisión negociada especial' +
          (datos.comisionPersonalizada.venta ? ' — Venta: ' + datos.comisionPersonalizada.venta + '%' : '') +
          (datos.comisionPersonalizada.alquiler ? ' — Alquiler: ' + datos.comisionPersonalizada.alquiler + '%' : '') + '</p>'
        : '') +

      (datos.proximaMejorAccion
        ? '<div class="card" style="background:#e8f0fe;border:1px solid #1a73e8;text-align:center">' +
          '<p style="font-size:12px;color:#1a73e8;font-weight:bold;margin:0 0 4px 0;letter-spacing:0.5px">🎯 TU PRÓXIMA MEJOR ACCIÓN</p>' +
          '<p style="font-size:15px;margin:0 0 4px 0">Contacta a <b>' + escaparHtml(datos.proximaMejorAccion.nombre) + '</b></p>' +
          '<p style="font-size:13px;color:var(--text-muted);margin:0">' + escaparHtml(datos.proximaMejorAccion.razon) + '</p>' +
          '</div>'
        : '') +

      '<div class="stat-grid">' +
      '<div class="stat"><span class="num">' + datos.kpis.compradoresActivos + '</span><span class="label">Compradores activos</span></div>' +
      '<div class="stat"><span class="num">' + (datos.kpis.alquileresActivos || 0) + '</span><span class="label">🔑 Buscan alquiler</span></div>' +
      '<div class="stat"><span class="num">' + datos.kpis.cierresConfirmados + '</span><span class="label">Cierres confirmados</span></div>' +
      '<div class="stat" title="% de tus compradores asignados en toda tu historia que terminaste cerrando en una venta real"><span class="num">' + datos.kpis.tasaConversionPct + '/100</span><span class="label">Tasa conversión</span></div>' +
      '<div class="stat"><span class="num">' + (datos.kpis.tiempoRespuestaHoras || '—') + '</span><span class="label">Horas resp.</span></div>' +
      '<div class="stat"><span class="num">' + datos.kpis.totalContactados + '</span><span class="label">Contactados</span></div>' +
      '<div class="stat"><span class="num">' + datos.kpis.totalVisitasRealizadas + '</span><span class="label">Visitas realizadas</span></div>' +
      '</div>' +

      '<div class="card" style="text-align:center"><h3>Tu tasa de conversión</h3>' +
      construirGraficoGauge(datos.kpis.tasaConversionPct, '#0f7a6b', 110) +
      '<p style="font-size:13px;color:var(--text-muted);margin-top:6px">De todos los compradores que te han asignado en tu historia, qué % terminaste cerrando en una venta real. Una buena tasa de conversión te beneficia dentro de la plataforma.</p></div>' +

      (datos.comisionesPendientes
        ? '<div class="alert">⚠️ Tienes ' + datos.comisionesPendientes + ' comisión(es) pendiente(s) de pago. Revisa tu correo.</div>'
        : '') +

      (datos.compradoresCompitiendo && datos.compradoresCompitiendo.length
        ? '<div class="card"><h3>⚡ En competencia</h3>' +
          '<p style="font-size:13px">Estos compradores fueron distribuidos a varios agentes al mismo tiempo, incluido tú. ' +
          'El primero en registrar una visita real se queda con la exclusividad.</p>' +
          datos.compradoresCompitiendo.map(c =>
            '<div style="border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">' +
            '<b style="font-size:15px">' + escaparHtml(c.nombre) + '</b>' +
            '<span style="font-size:13px;background:var(--sand-deep);padding:2px 10px;border-radius:100px">' + c.clasificacion + '</span>' +
            '</div>' +
            badgeFormaPago(c.formaPago) +
            '<div style="font-size:13px;color:var(--text-muted);margin-bottom:4px">📍 ' + (c.zona || '—') + '</div>' +
            '<div style="font-size:13px;margin-bottom:8px;color:#b8860b">💰 Comisión estimada: <b>' + formatoRD(c.comisionEstMin) + ' - ' + formatoRD(c.comisionEstMax) + '</b></div>' +
            '<div style="display:flex;gap:6px">' +
            (c.linkWhatsApp ? '<a href="' + c.linkWhatsApp + '" target="_blank" class="btn btn-sm" style="background:#25D366;color:white;text-decoration:none">💬 WhatsApp</a>' : '') +
            '<button class="btn btn-primary btn-sm" onclick="abrirAccionRapida(\'visita\',\'' + c.id + '\',\'' + escaparHtml(c.nombre).replace(/'/g, "\'") + '\')">📝 Ganar con visita</button>' +
            '</div></div>'
          ).join('') +
          '</div>'
        : '') +

      '<div id="ancla-compradores"></div>' +
      '<div class="card"><h3>Tus compradores activos (' + datos.compradores.length + ')</h3>' +
      (datos.compradores.length
        ? '<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">' +
          '<input id="buscarComprador" type="text" placeholder="🔍 Buscar por nombre o zona…" oninput="filtrarCompradores()" style="flex:1;min-width:160px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px">' +
          '<select id="filtroEtapa" onchange="filtrarCompradores()" style="padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px">' +
          '<option value="">Todas las etapas</option>' +
          [...new Set(datos.compradores.map(c => c.etapaRutaCompra))].filter(Boolean).map(e => '<option value="' + e + '">' + e + '</option>').join('') +
          '</select></div>'
        : '') +
      '<div id="listaCompradores">' + (datos.compradores.length ? filas : '<p>No tienes compradores activos en este momento.</p>') + '</div>' +
      '</div>' +

      '<div class="card" id="cardAccionRapida" style="display:none;border:2px solid #1a73e8"></div>' +

      (datos.alquileresCompitiendo && datos.alquileresCompitiendo.length
        ? '<div class="card"><h3>⚡ Alquileres en competencia</h3>' +
          '<p style="font-size:13px">Estas solicitudes fueron distribuidas a varios agentes al mismo tiempo, incluido tú. ' +
          'El primero en reportar el cierre se queda con la comisión.</p>' +
          datos.alquileresCompitiendo.map(a =>
            '<div style="border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">' +
            '<b style="font-size:15px">' + escaparHtml(a.nombre) + '</b>' +
            '<span style="font-size:13px;background:var(--sand-deep);padding:2px 10px;border-radius:100px">' + a.clasificacion + '</span>' +
            '</div>' +
            '<div style="font-size:13px;color:var(--text-muted);margin-bottom:4px">📍 ' + (a.zona || '—') + '</div>' +
            '<div style="font-size:13px;margin-bottom:8px;color:#b8860b">💰 Comisión estimada: <b>' + formatoRD(a.comisionEstMin) + ' - ' + formatoRD(a.comisionEstMax) + '</b></div>' +
            '<div style="display:flex;gap:6px">' +
            (a.linkWhatsApp ? '<a href="' + a.linkWhatsApp + '" target="_blank" class="btn btn-sm" style="background:#25D366;color:white;text-decoration:none">💬 WhatsApp</a>' : '') +
            '<button class="btn btn-primary btn-sm" onclick="abrirAccionRapida(\'visitaAlquiler\',\'' + a.id + '\',\'' + escaparHtml(a.nombre).replace(/'/g, "\'") + '\')">📝 Ganar con visita</button> ' +
            '<button class="btn btn-outline btn-sm" onclick="abrirAccionRapida(\'cierreAlquiler\',\'' + a.id + '\',\'' + escaparHtml(a.nombre).replace(/'/g, "\'") + '\')">✅ Ganar con cierre</button>' +
            '</div></div>'
          ).join('') +
          '</div>'
        : '') +

      '<div id="ancla-alquileres"></div>' +
      '<div class="card"><h3>🔑 Tus alquileres asignados</h3>' +
      (datos.alquileresActivos && datos.alquileresActivos.length
        ? datos.alquileresActivos.map(a =>
            '<div style="border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">' +
            '<b style="font-size:15px">' + escaparHtml(a.nombre) + '</b>' +
            '<span style="font-size:13px;color:var(--text-muted);font-family:var(--font-mono)">' + a.id + '</span>' +
            '</div>' +
            '<div style="font-size:13px;margin-bottom:4px">' + a.zona + ' · ' + a.presupuesto + ' · ' + a.clasificacion + '</div>' +
            (a.fechaMudanzaDeseada ? '<div style="font-size:13px;color:var(--text-muted);margin-bottom:4px">📅 Mudanza deseada: ' + new Date(a.fechaMudanzaDeseada).toLocaleDateString('es-DO') + '</div>' : '') +
            '<div style="font-size:13px;margin-bottom:8px;color:#b8860b">💰 Comisión estimada si cierras: <b>' + formatoRD(a.comisionEstMin) + ' - ' + formatoRD(a.comisionEstMax) + '</b></div>' +
            renderHistorialVisitas(a.historialVisitas) +
            '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
            (a.linkWhatsApp ? '<a href="' + a.linkWhatsApp + '" target="_blank" class="btn btn-sm" style="background:#25D366;color:white;text-decoration:none">💬 WhatsApp</a>' : '') +
            '<button class="btn btn-outline btn-sm" onclick="abrirAccionRapida(\'visitaAlquiler\',\'' + a.id + '\',\'' + escaparHtml(a.nombre).replace(/'/g, "\'") + '\')">📝 Visita</button>' +
            '<button class="btn btn-outline btn-sm" onclick="abrirAccionRapida(\'cierreAlquiler\',\'' + a.id + '\',\'' + escaparHtml(a.nombre).replace(/'/g, "\'") + '\')">✅ Cerrar</button>' +
            '</div></div>'
          ).join('')
        : '<p>No tienes alquileres asignados en este momento.</p>') +
      '</div>' +

      '<div id="ancla-comisiones"></div>' +
      (datos.misComisiones && datos.misComisiones.length
        ? '<div class="card"><h3>💰 Tus comisiones</h3>' +
          (datos.cuentaBancariaPlataforma
            ? '<div style="background:#e8f0fe;padding:10px;border-radius:8px;margin-bottom:12px">' +
              '<p style="font-size:13px;margin-bottom:4px"><b>Cuenta para transferir tu comisión de la plataforma:</b></p>' +
              '<p style="font-size:13px;font-family:var(--font-mono)" id="cuentaPlataformaTexto">' + datos.cuentaBancariaPlataforma + '</p>' +
              '<button class="btn btn-outline btn-sm" onclick="copiarCuentaPlataforma()">📋 Copiar cuenta</button>' +
              '<span id="cuentaCopiadaMsj" style="font-size:13px;margin-left:8px"></span>' +
              '</div>'
            : '') +
          '<p style="font-size:13px;color:var(--text-muted)">Cierres ya confirmados. 1) Transfiere el monto a la cuenta indicada. 2) Envía tu solicitud de pago — la aprobamos apenas confirmemos que llegó.</p>' +
          datos.misComisiones.map(m => {
            let colorEstado = '#999', textoEstado = m.estado;
            let mostrarBotonYaPague = false;
            if (m.estado === 'Pagado') { colorEstado = '#0f7a6b'; textoEstado = '✅ Pagada'; }
            else if (m.estado === 'En revisión') { colorEstado = '#e4572e'; textoEstado = '⚠️ En revisión'; }
            else if (m.estado === 'Pago reportado por agente') { colorEstado = '#1a73e8'; textoEstado = '📨 Solicitud de pago en revisión'; }
            else { textoEstado = '⏳ Pendiente de pago'; colorEstado = '#b8860b'; mostrarBotonYaPague = true; }
            return '<div style="border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px">' +
              '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">' +
              '<b style="font-size:15px">' + m.id + '</b>' +
              '<span style="font-size:13px;background:var(--sand-deep);padding:2px 10px;border-radius:100px">' + m.tipo + '</span>' +
              '</div>' +
              '<div style="font-size:13px;color:var(--text-muted);margin-bottom:4px">' + new Date(m.fecha).toLocaleDateString('es-DO') + '</div>' +
              (m.desglose
                ? '<div style="font-size:13px;color:var(--text-muted);background:var(--sand-deep);padding:8px;border-radius:8px;margin-bottom:6px">' +
                  (m.tipo === 'Alquiler' ? 'Alquiler mensual: ' : 'Venta: ') + formatoRD(m.desglose.montoVenta) + ' → ' +
                  'Tu comisión (' + m.desglose.pctComisionAgente + '%): ' + formatoRD(m.desglose.comisionAgenteRD) + ' → ' +
                  'A la plataforma (' + m.desglose.pctPlataforma + '% de tu comisión): <b>' + formatoRD(m.monto) + '</b>' +
                  '</div>'
                : '') +
              '<div style="font-size:15px;margin-bottom:6px"><b style="color:' + colorEstado + '">' + formatoRD(m.monto) + '</b> · ' + textoEstado + '</div>' +
              (mostrarBotonYaPague
                ? '<button class="btn btn-primary btn-sm" onclick="reportarPagoRealizado(\'' + m.id + '\',\'' + m.tipo + '\')">📨 Enviar solicitud de pago</button><span id="pagoMsj_' + m.id + '" style="font-size:13px;margin-left:8px"></span>'
                : '') +
              '</div>';
          }).join('') +
          '</div>'
        : '') +

      (datos.premium.activo
        ? '<div class="card" style="border:2px solid #b8860b;text-align:center">' +
          '<h3>⭐ Membresía Premium activa</h3>' +
          '<p style="font-size:13px">Vigente hasta <b>' + new Date(datos.premium.fechaVencimiento).toLocaleDateString('es-DO') + '</b></p>' +
          '<p style="font-size:13px">Pagas <b>' + datos.premium.pctPlataformaPremium + '%</b> a la plataforma por cada venta (en vez de ' + datos.premium.pctPlataformaNormal + '%) y tienes prioridad en la asignación de nuevos compradores e inquilinos.</p>' +
          '</div>'
        : '<div class="card" style="border:2px solid #b8860b">' +
          '<h3>⭐ Membresía Premium — RD$' + datos.premium.cuota + '/mes</h3>' +
          '<p style="font-size:13px;color:var(--text-muted);margin-bottom:8px">Una inversión mensual pequeña que se paga sola con tu primer cierre del mes. Diseñada para agentes que quieren crecer más rápido en la plataforma.</p>' +
          '<ul style="font-size:13px;padding-left:18px">' +
          '<li>Pagas solo <b>' + datos.premium.pctPlataformaPremium + '%</b> a la plataforma por cada venta (en vez de ' + datos.premium.pctPlataformaNormal + '%) — más ganancia neta en cada cierre.</li>' +
          '<li>Prioridad real en la asignación de compradores e inquilinos nuevos.</li>' +
          '<li>Insignia Premium visible en tu perfil.</li>' +
          '</ul>' +
          (datos.premium.pagoReportado
            ? '<p style="font-size:13px;color:#1a73e8">📨 Tu solicitud está en revisión — te confirmamos apenas se apruebe.</p>'
            : (datos.cuentaBancariaPlataforma
                ? '<p style="font-size:13px;color:var(--text-muted)">1) Transfiere RD$' + datos.premium.cuota + ' a: <b>' + datos.cuentaBancariaPlataforma + '</b><br>2) Envía tu solicitud abajo — la aprobamos apenas confirmemos el pago.</p>' +
                  '<button class="btn btn-primary" onclick="reportarPagoPremiumAgente()">⭐ Enviar solicitud de membresía</button><span id="premiumMsj" style="font-size:13px;margin-left:8px"></span>'
                : '<button class="btn btn-primary" onclick="reportarPagoPremiumAgente()">⭐ Enviar solicitud de membresía</button><span id="premiumMsj" style="font-size:13px;margin-left:8px"></span>')) +
          '</div>') +

      '<div id="ancla-cuenta"></div>' +
      '<div class="card"><h3>⚙️ Mi disponibilidad</h3>' +
      '<p style="font-size:13px">Desactívala si no puedes recibir compradores nuevos ahora (vacaciones, sobrecarga, etc.) — se reactiva cuando quieras, sin depender del admin.</p>' +
      '<button class="btn ' + (disponible ? 'btn-primary' : 'btn-outline') + '" onclick="cambiarDisponibilidad(\'Sí\')">✅ Disponible</button> ' +
      '<button class="btn ' + (!disponible ? 'btn-coral' : 'btn-outline') + '" onclick="cambiarDisponibilidad(\'No\')">⏸️ No disponible</button>' +
      '</div>' +

      '<div class="card"><h3>🔑 Atención de alquileres</h3>' +
      '<p style="font-size:13px">Si la activas, también recibirás solicitudes de personas buscando alquilar, no solo comprar. Se detectó automáticamente de tu especialidad, pero puedes ajustarlo aquí cuando quieras.</p>' +
      '<button class="btn ' + (atiendeAlquileres ? 'btn-primary' : 'btn-outline') + '" onclick="cambiarAtiendeAlquileres(\'Sí\')">✅ Sí, atiendo alquileres</button> ' +
      '<button class="btn ' + (!atiendeAlquileres ? 'btn-coral' : 'btn-outline') + '" onclick="cambiarAtiendeAlquileres(\'No\')">🚫 No por ahora</button>' +
      '<p id="mensajeAlquileres" style="font-size:13px;margin-top:8px"></p>' +
      '</div>' +

      '<div class="card"><h3>⚙️ Mi información</h3>' +
      '<label style="font-size:13px">Teléfono</label>' +
      '<div class="code-input"><input type="text" id="inputTelefonoAgente" value="' + datos.telefono + '">' +
      '<button class="btn btn-outline btn-sm" onclick="guardarCampoAgente(\'actualizarTelefono\',\'inputTelefonoAgente\')">💾 Guardar</button></div>' +
      '<label style="font-size:13px;margin-top:10px;display:block">Correo</label>' +
      '<div class="code-input"><input type="text" id="inputEmailAgente" value="' + datos.email + '">' +
      '<button class="btn btn-outline btn-sm" onclick="guardarCampoAgente(\'actualizarEmail\',\'inputEmailAgente\')">💾 Guardar</button></div>' +
      '<p id="mensajeGuardadoAgente" style="font-size:13px;margin-top:8px"></p></div>';
  }

  async function reportarPagoPremiumAgente() {
    const msj = document.getElementById('premiumMsj');
    msj.textContent = 'Enviando…';
    try {
      const resultado = await ejecutarAccion({ panel: CODIGO_PANEL, accion: 'reportarPagoPremium' });
      if (resultado.error) { msj.textContent = '⚠️ ' + resultado.mensaje; return; }
      cargarPanel();
    } catch (e) {
      msj.textContent = '⚠️ Ocurrió un problema de conexión.';
    }
  }

  async function copiarCuentaPlataforma() {
    const texto = document.getElementById('cuentaPlataformaTexto').textContent;
    const msj = document.getElementById('cuentaCopiadaMsj');
    try {
      await navigator.clipboard.writeText(texto);
      msj.textContent = '¡Copiado!';
    } catch (e) {
      msj.textContent = 'No se pudo copiar — selecciona el texto manualmente.';
    }
  }

  async function reportarPagoRealizado(idCierre, tipo) {
    const msj = document.getElementById('pagoMsj_' + idCierre);
    msj.textContent = 'Enviando…';
    try {
      const resultado = await ejecutarAccion({ panel: CODIGO_PANEL, accion: 'reportarPagoRealizado', idCierre: idCierre, tipoCierre: tipo });
      if (resultado.error) { msj.textContent = '⚠️ ' + resultado.mensaje; return; }
      cargarPanel();
    } catch (e) {
      msj.textContent = '⚠️ Ocurrió un problema de conexión.';
    }
  }

  let contadorHistorial = 0;
  function construirTarjetaComprador(c) {
    return '<div style="border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">' +
      '<b style="font-size:15px">' + escaparHtml(c.nombre) + '</b>' +
      '<span style="font-size:13px;color:var(--text-muted);font-family:var(--font-mono)">' + c.id + '</span>' +
      '</div>' +
      badgeFormaPago(c.formaPago) +
      (c.viveEnElExterior ? '<div style="background:#e8f0fe;color:#1a73e8;padding:4px 8px;border-radius:6px;font-size:12px;margin-bottom:6px;display:inline-block">🌎 Vive en el exterior — considera videollamada</div>' : '') +
      (c.resumenCompatibilidad ? '<div style="background:' + colorFondoPorNivelCompatibilidad(c.resumenCompatibilidad.nivel) + ';padding:8px 10px;border-radius:8px;margin-bottom:6px;font-size:13px"><b>' + c.resumenCompatibilidad.emoji + ' Compatibilidad ' + c.resumenCompatibilidad.nivel + '</b><br>' + escaparHtml(c.resumenCompatibilidad.resumen) + '</div>' : '') +
      '<div style="font-size:15px;font-weight:bold;color:var(--teal-deep);margin-bottom:4px">⭐ PropScore: ' + c.propScore + '/100</div>' +
      '<div style="font-size:13px;margin-bottom:4px">' + c.etapaRutaCompra + ' · ' + c.ipcEtiqueta + '</div>' +
      '<div style="font-size:13px;color:var(--text-muted);margin-bottom:4px">📍 ' + (c.zona || '—') + '</div>' +
      '<div style="font-size:13px;margin-bottom:6px;color:#b8860b">💰 Comisión estimada si cierras: <b>' + formatoRD(c.comisionEstMin) + ' - ' + formatoRD(c.comisionEstMax) + '</b></div>' +
      construirLineaDeTiempo(c) +
      construirSeccionPlegable('detalle_' + c.id, '📊 Ver presupuesto e historial de visitas',
        construirGraficoPresupuesto(c.graficoPresupuesto) + renderHistorialVisitas(c.historialVisitas)) +
      '<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">' +
      (c.contactoPendiente
        ? '<button class="btn btn-primary btn-sm" onclick="cargarPanel(\'' + c.id + '\')">📞 Marcar contacto</button>'
        : '<span style="font-size:13px">✅ Contactado</span>') +
      (c.linkWhatsApp ? '<a href="' + c.linkWhatsApp + '" target="_blank" class="btn btn-sm" style="background:#25D366;color:white;text-decoration:none">💬 WhatsApp</a>' : '') +
      '<button class="btn btn-outline btn-sm" onclick="abrirAccionRapida(\'visita\',\'' + c.id + '\',\'' + escaparHtml(c.nombre).replace(/'/g, "\'") + '\')">📝 Visita</button>' +
      '<button class="btn btn-outline btn-sm" onclick="abrirAccionRapida(\'cierreVenta\',\'' + c.id + '\',\'' + escaparHtml(c.nombre).replace(/'/g, "\'") + '\')">✅ Cerrar</button>' +
      '</div></div>';
  }

  /**
   * Buscador + filtro de compradores — útil sobre todo para agentes con
   * cartera grande, donde antes había que hacer scroll manual por todos.
   * Filtra por nombre/zona (texto libre) y por etapa del proceso.
   */
  function filtrarCompradores() {
    const texto = (document.getElementById('buscarComprador').value || '').toLowerCase();
    const etapaFiltro = document.getElementById('filtroEtapa').value;
    const lista = (window.TODOS_LOS_COMPRADORES || []).filter(c => {
      const coincideTexto = !texto || (c.nombre || '').toLowerCase().includes(texto) || (c.zona || '').toLowerCase().includes(texto);
      const coincideEtapa = !etapaFiltro || c.etapaRutaCompra === etapaFiltro;
      return coincideTexto && coincideEtapa;
    });
    document.getElementById('listaCompradores').innerHTML = lista.length
      ? lista.map(construirTarjetaComprador).join('')
      : '<p style="text-align:center;color:var(--text-muted);font-size:14px">Ningún comprador coincide con tu búsqueda.</p>';
  }

  function renderHistorialVisitas(historial) {
    if (!historial || !historial.length) return '';
    const badge = (valor, siTexto, noTexto) => {
      if (valor === 'Sí') return '<span style="color:#0f7a6b;font-size:12px">✅ ' + siTexto + '</span>';
      if (valor === 'No') return '<span style="color:#e4572e;font-size:12px">❌ ' + noTexto + '</span>';
      return '<span style="color:#999;font-size:12px">⏳ Sin responder</span>';
    };
    const filas = historial.map(v =>
      '<div style="font-size:13px;padding:8px 0;border-bottom:1px solid var(--line)">' +
      '<b>Visita ' + v.numero + '</b> — ' + (v.fecha ? new Date(v.fecha).toLocaleDateString('es-DO') : '—') + ' · ' + v.resultado +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px">' +
      badge(v.leGusto, 'Le gustó', 'No le gustó') +
      badge(v.confirmoVisita, 'Confirmó la visita', 'No confirmó visita') +
      badge(v.agentePuntual, 'Llegaste puntual', 'No llegaste puntual') +
      badge(v.agenteExplicoBien, 'Explicaste bien', 'No explicaste bien') +
      badge(v.recomendaria, 'Te recomendaría', 'No te recomendaría') +
      '</div></div>'
    ).join('');
    // Visible de entrada (ya no oculto) — es justamente la opinión que el
    // comprador dejó, lo más útil para que el agente ajuste su enfoque.
    return '<div class="card" style="margin-top:8px;padding:12px">' +
      '<h4 style="margin:0 0 6px 0;font-size:14px">⭐ Opinión de sus visitas (' + historial.length + ')</h4>' +
      filas +
      '</div>';
  }

  /**
   * Línea de tiempo simple del proceso completo del comprador — desde su
   * registro hasta su etapa actual, con sus visitas marcadas en el
   * camino. Pensada para que cualquier persona, sin entrenamiento,
   * entienda de un vistazo en qué punto va este comprador.
   */
  function construirLineaDeTiempo(c) {
    const etapasVisibles = ['Registrado', 'Asignado', 'Visitando', 'Reservado', 'Cerrado'];
    // Mapeo de los valores REALES que guarda el sistema (calcularEtapaRutaCompra_)
    // a las 5 etapas simplificadas que se muestran — varios valores internos
    // (ej. "Visita 1", "Nueva búsqueda", "Visita 2+") se agrupan en "Visitando"
    // para que la línea de tiempo sea clara para cualquier persona, sin
    // necesitar conocer el detalle interno del sistema.
    const mapaEtapas = {
      'Evaluación': 0, 'Comprador Verificado': 0,
      'Agente Asignado': 1,
      'Visita 1': 2, 'Nueva búsqueda': 2, 'Visita 2+': 2,
      'Reserva': 3,
      'Compra': 4
    };
    const etapaActualIdx = mapaEtapas[c.etapaRutaCompra] !== undefined ? mapaEtapas[c.etapaRutaCompra] : 0;
    const totalVisitas = (c.historialVisitas || []).length;

    const pasos = etapasVisibles.map((etapa, i) => {
      const completado = i < etapaActualIdx;
      const actual = i === etapaActualIdx;
      const color = completado ? '#0f7a6b' : (actual ? '#1a73e8' : '#d8d2c2');
      const icono = completado ? '✓' : (i + 1);
      return '<div style="display:flex;flex-direction:column;align-items:center;flex:1">' +
        '<div style="width:26px;height:26px;border-radius:50%;background:' + color + ';color:white;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold">' + icono + '</div>' +
        '<span style="font-size:10px;margin-top:4px;text-align:center;color:' + (actual ? '#1a73e8' : '#8a8272') + ';font-weight:' + (actual ? 'bold' : 'normal') + '">' + etapa + '</span>' +
        '</div>';
    }).join('<div style="flex:0.4;height:2px;background:#d8d2c2;margin-top:13px"></div>');

    return '<div style="margin:10px 0 4px 0">' +
      '<div style="display:flex;align-items:flex-start">' + pasos + '</div>' +
      (totalVisitas ? '<p style="font-size:11px;color:var(--text-muted);text-align:center;margin-top:6px">' + totalVisitas + ' visita(s) registrada(s)</p>' : '') +
      '</div>';
  }

  function badgeFormaPago(formaPago) {
    if (!formaPago || formaPago === 'No especificado') return '';
    let color = '#999', icono = '';
    if (formaPago.includes('contado')) { color = '#0f7a6b'; icono = '💵'; }
    else if (formaPago.includes('Financiado')) { color = '#1a73e8'; icono = '🏦'; }
    else if (formaPago.includes('Combinación')) { color = '#b8860b'; icono = '💵🏦'; }
    return '<div style="margin-bottom:6px"><span style="font-size:13px;background:' + color + ';color:white;padding:2px 10px;border-radius:100px">' + icono + ' ' + formaPago + '</span></div>';
  }

  async function cambiarDisponibilidad(valor) {
    await ejecutarAccion({ panel: CODIGO_PANEL, accion: 'toggleDisponibilidad', valor: valor });
    cargarPanel();
  }

  async function cambiarAtiendeAlquileres(valor) {
    const msj = document.getElementById('mensajeAlquileres');
    if (msj) msj.textContent = 'Guardando…';
    try {
      await ejecutarAccion({ panel: CODIGO_PANEL, accion: 'toggleAtiendeAlquileres', valor: valor });
      await cargarPanel();
      const msjNuevo = document.getElementById('mensajeAlquileres');
      if (msjNuevo) {
        msjNuevo.textContent = valor === 'Sí' ? '✅ Guardado — ya recibirás solicitudes de alquiler.' : '✅ Guardado — no recibirás solicitudes de alquiler.';
        msjNuevo.style.color = '#0f7a6b';
      }
    } catch (e) {
      if (msj) { msj.textContent = '⚠️ Ocurrió un problema de conexión.'; msj.style.color = '#e4572e'; }
    }
  }

  // ============================================================
  //  ACCIONES RÁPIDAS: registrar visita o cierre sin salir del Panel,
  //  sin escribir ningún ID a mano — ya lo trae el botón que se apretó.
  // ============================================================
  function actualizarProximoPaso() {
    const quePaso = document.getElementById('raQuePaso').value;
    const select = document.getElementById('raProximoPaso');
    let opciones;
    if (quePaso === 'Le gustó - quiere reservar' || quePaso === 'Reservó en el momento') {
      // "Agendar otra visita" no tiene sentido si ya le gustó o reservó
      opciones = [['Esperar respuesta', 'Esperar respuesta / coordinar reserva'], ['Comprador perdido - no seguir', 'Comprador perdido - no seguir']];
    } else if (quePaso === 'Comprador no asistió' || quePaso === 'Tuve que cancelar/reprogramar') {
      opciones = [['Agendar otra visita', 'Reprogramar visita'], ['Comprador perdido - no seguir', 'Comprador perdido - no seguir']];
    } else {
      // "No le gustó - seguir buscando"
      opciones = [['Agendar otra visita', 'Agendar otra visita'], ['Esperar respuesta', 'Esperar respuesta'], ['Comprador perdido - no seguir', 'Comprador perdido - no seguir']];
    }
    select.innerHTML = opciones.map(([valor, texto]) => '<option value="' + valor + '">' + texto + '</option>').join('');
  }

  function abrirAccionRapida(tipo, id, nombre) {
    const cont = document.getElementById('cardAccionRapida');
    cont.style.display = 'block';

    if (tipo === 'visitaAlquiler') {
      cont.innerHTML =
        '<h3>📝 Registrar visita — ' + nombre + '</h3>' +
        '<p style="font-size:13px">Confirma que ya visitaste la propiedad con el inquilino — esto te da la exclusividad de esta solicitud.</p>' +
        '<button class="btn btn-primary" onclick="enviarAccionRapida(\'visitaAlquiler\',\'' + id + '\')">✅ Confirmar visita realizada</button> ' +
        '<button class="btn btn-outline" onclick="cerrarAccionRapida()">✖️ Cancelar</button>' +
        '<p id="raMensaje" style="font-size:13px;margin-top:8px"></p>';
    } else if (tipo === 'visita') {
      cont.innerHTML =
        '<h3>📝 Registrar visita — ' + nombre + '</h3>' +
        '<label style="font-size:13px">¿Qué pasó en la visita?</label>' +
        '<select id="raQuePaso" class="btn btn-outline" style="width:100%;margin-bottom:8px" onchange="actualizarProximoPaso()">' +
        '<option value="Le gustó - quiere reservar">Le gustó - quiere reservar</option>' +
        '<option value="No le gustó - seguir buscando">No le gustó - seguir buscando</option>' +
        '<option value="Reservó en el momento">Reservó en el momento</option>' +
        '<option value="Comprador no asistió">Comprador no asistió</option>' +
        '<option value="Tuve que cancelar/reprogramar">Tuve que cancelar/reprogramar</option>' +
        '</select>' +
        '<label style="font-size:13px">Si no le gustó, ¿por qué? (opcional)</label>' +
        '<input type="text" id="raMotivo" style="width:100%;margin-bottom:8px">' +
        '<label style="font-size:13px">¿Qué tan compatible fue (1-5)?</label>' +
        '<input type="number" id="raCompatibilidad" min="1" max="5" style="width:100%;margin-bottom:8px">' +
        '<label style="font-size:13px">¿Próximo paso?</label>' +
        '<select id="raProximoPaso" class="btn btn-outline" style="width:100%;margin-bottom:10px"></select>' +
        '<button class="btn btn-primary" onclick="enviarAccionRapida(\'visita\',\'' + id + '\')">📝 Registrar visita</button> ' +
        '<button class="btn btn-outline" onclick="cerrarAccionRapida()">✖️ Cancelar</button>' +
        '<p id="raMensaje" style="font-size:13px;margin-top:8px"></p>';
      actualizarProximoPaso();
    } else if (tipo === 'cierreVenta' || tipo === 'cierreAlquiler') {
      const esAlquiler = tipo === 'cierreAlquiler';
      cont.innerHTML =
        '<h3>✅ Registrar cierre de ' + (esAlquiler ? 'alquiler' : 'venta') + ' — ' + nombre + '</h3>' +
        '<label style="font-size:13px">Monto ' + (esAlquiler ? 'de alquiler mensual' : 'final de venta') + ' (RD$)</label>' +
        '<input type="number" id="raMonto" style="width:100%;margin-bottom:8px">' +
        (esAlquiler
          ? '<label style="font-size:13px">Duración del contrato (meses)</label><input type="number" id="raMeses" value="12" style="width:100%;margin-bottom:8px">'
          : '') +
        '<label style="font-size:13px">Enlace a evidencia (opcional — útil solo si hay una disputa)</label>' +
        '<input type="text" id="raEvidencia" style="width:100%;margin-bottom:6px">' +
        '<label style="font-size:13px">O adjunta una foto del contrato (opcional)</label>' +
        '<input type="file" id="raEvidenciaArchivo" accept="image/*,application/pdf" style="width:100%;margin-bottom:8px">' +
        '<label style="font-size:13px">¿El monto final fue distinto al esperado? (opcional)</label>' +
        '<input type="text" id="raNota" style="width:100%;margin-bottom:10px">' +
        '<button class="btn btn-primary" onclick="enviarAccionRapida(\'' + tipo + '\',\'' + id + '\')">✅ Registrar cierre</button> ' +
        '<button class="btn btn-outline" onclick="cerrarAccionRapida()">✖️ Cancelar</button>' +
        '<p id="raMensaje" style="font-size:13px;margin-top:8px"></p>';
    }
    cont.scrollIntoView({ behavior: 'smooth' });
  }

  function cerrarAccionRapida() {
    document.getElementById('cardAccionRapida').style.display = 'none';
  }

  async function enviarAccionRapida(tipo, id) {
    const msj = document.getElementById('raMensaje');
    msj.textContent = 'Enviando…';
    let params = { panel: CODIGO_PANEL };

    if (tipo === 'visitaAlquiler') {
      params.accion = 'registrarVisitaAlquilerAgente';
      params.idSolicitud = id;
    } else if (tipo === 'visita') {
      params.accion = 'registrarVisitaAgente';
      params.idComprador = id;
      params.quePaso = document.getElementById('raQuePaso').value;
      params.motivoRechazo = document.getElementById('raMotivo').value;
      params.compatibilidad = document.getElementById('raCompatibilidad').value;
      params.proximoPaso = document.getElementById('raProximoPaso').value;
    } else if (tipo === 'cierreVenta') {
      params.accion = 'registrarCierreVentaAgente';
      params.idComprador = id;
      params.montoVenta = document.getElementById('raMonto').value;
      params.evidenciaUrl = document.getElementById('raEvidencia').value;
      params.nota = document.getElementById('raNota').value;
    } else if (tipo === 'cierreAlquiler') {
      params.accion = 'registrarCierreAlquilerAgente';
      params.idSolicitud = id;
      params.montoMensual = document.getElementById('raMonto').value;
      params.mesesContrato = document.getElementById('raMeses').value;
      params.evidenciaUrl = document.getElementById('raEvidencia').value;
      params.nota = document.getElementById('raNota').value;
    }

    try {
      const inputArchivo = document.getElementById('raEvidenciaArchivo');
      const resultado = (inputArchivo && inputArchivo.files.length)
        ? await ejecutarAccionConArchivo(params, inputArchivo)
        : await ejecutarAccion(params);
      if (resultado.error) { msj.textContent = '⚠️ ' + resultado.mensaje; return; }
      msj.textContent = '✅ ' + (resultado.mensaje || 'Registrado correctamente.');
      setTimeout(() => cargarPanel(), 1200);
    } catch (e) {
      msj.textContent = '⚠️ Ocurrió un problema de conexión. Intenta de nuevo.';
    }
  }

  async function guardarCampoAgente(accion, inputId) {
    const valor = document.getElementById(inputId).value.trim();
    if (!valor) return;
    const msj = document.getElementById('mensajeGuardadoAgente');
    msj.textContent = 'Guardando…';
    try {
      const resultado = await ejecutarAccion({ panel: CODIGO_PANEL, accion: accion, valor: valor });
      msj.textContent = resultado.error ? '⚠️ ' + resultado.mensaje : '✅ Guardado.';
    } catch (e) {
      msj.textContent = '⚠️ No se pudo guardar. Intenta de nuevo.';
    }
  }

  (async function () {
    CODIGO_PANEL = obtenerParametro('codigo') || obtenerParametro('panel');
    if (!CODIGO_PANEL) { mostrarError('contenido', 'Falta tu código de acceso en el enlace.'); return; }
    try {
      await cargarPanel();
    } catch (err) {
      mostrarError('contenido', 'Ocurrió un problema de conexión. Intenta de nuevo en unos minutos.');
    }
  })();
</script>
</body>
</html>

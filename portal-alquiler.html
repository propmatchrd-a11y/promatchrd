<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b5c50">
<link rel="apple-touch-icon" href="icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PropMatchRD">
<title>Tu Solicitud de Alquiler — PropMatchRD</title>
<link rel="stylesheet" href="styles.css">
<script src="fondo-premium.js" defer></script>
</head>
<body>
<div class="wrap" id="contenido"></div>

<script src="app.js"></script>
<script>
  document.getElementById('contenido').innerHTML = construirEsqueletoCarga(2);
async function cargarPortalAlquiler() {
  if (mostrarMantenimientoSiAplica('contenido')) return;
  const codigo = obtenerParametro('codigo') || obtenerParametro('portalAlquiler');
  if (!codigo) { mostrarError('contenido', 'Falta tu código de acceso en el enlace.'); return; }
  window.CODIGO_PORTAL_ALQUILER_ACTUAL = codigo;
  guardarCodigoRecordado('alquiler', codigo); // automatización: la próxima vez, index.html ya lo recuerda

  try {
    const datos = await llamarApi({ portalAlquiler: codigo });
    if (datos.error) { mostrarError('contenido', datos.mensaje); return; }
    window.ID_CIERRE_PENDIENTE_ALQUILER = datos.montoCierrePendiente ? datos.montoCierrePendiente.idCierre : null;

    const iconos = { Diamante: '💎', Oro: '🥇', Plata: '🥈', Bronce: '🥉' };

    document.getElementById('contenido').innerHTML =
      '<div style="display:flex;justify-content:flex-end"><button id="btnActualizarPortalAlquiler" onclick="actualizarPortalAlquilerManual()" style="background:var(--teal);color:white;border:none;border-radius:100px;padding:6px 12px;font-size:12px;cursor:pointer">🔄 Actualizar</button></div>' +
      '<h1 style="text-align:center">Hola ' + escaparHtml(datos.nombre) + '</h1>' +
      '<p style="text-align:center;font-family:var(--font-mono);color:var(--text-muted)">Solicitud: ' + datos.idSolicitud + '</p>' +

      '<div class="card" style="text-align:center">' +
      '<h3>' + datos.estadoExplicado + '</h3>' +
      '</div>' +

      (datos.montoCierrePendiente
        ? '<div class="card" style="text-align:center;background:#fff3cd"><h3>💰 Tu agente reportó un cierre</h3>' +
          '<p style="font-size:15px;margin:6px 0">Monto mensual reportado: <b>RD$' + Number(datos.montoCierrePendiente.montoVenta).toLocaleString('es-DO') + '</b></p>' +
          '<p style="font-size:13px;color:var(--text-muted)">¿Es correcto este monto?</p>' +
          '<button class="btn btn-primary" onclick="confirmarMontoAlquiler(\'Sí\')">✅ Sí, es correcto</button> ' +
          '<button class="btn btn-outline" onclick="confirmarMontoAlquiler(\'No\')">❌ No es correcto</button>' +
          '<div id="respuestaMontoAlquiler" style="margin-top:8px"></div></div>'
        : '') +

      (datos.agenteLinkWhatsApp
        ? construirTarjetaAgente(datos.agentePerfil, datos.agenteLinkWhatsApp)
        : '<div class="alert info" style="text-align:center">Estamos conectándote con el agente más adecuado para ti — en breve verás aquí sus datos de contacto.</div>') +

      (datos.calificacionVisitaPendiente ? construirMiniEncuestaVisitaAlquiler() : '') +
      construirHistorialVisitasAlquiler(datos.historialVisitas) +
      construirConexionesDirectasPendientesAlquiler(datos.conexionesDirectasPendientes) +

      (datos.evaluacion
        ? '<div class="card"><h3>Tu evaluación</h3><p>' + datos.evaluacion + '</p></div>'
        : '') +

      '<div class="card"><h3>Tu búsqueda</h3>' +
      '<table>' +
      '<tr><td style="padding:4px 8px;color:var(--text-muted)">Tipo de inmueble</td><td style="padding:4px 8px"><b>' + datos.tipoInmueble + '</b></td></tr>' +
      '<tr><td style="padding:4px 8px;color:var(--text-muted)">Zona</td><td style="padding:4px 8px"><b>' + datos.provincia + ' - ' + datos.municipio + '</b></td></tr>' +
      '<tr><td style="padding:4px 8px;color:var(--text-muted)">Presupuesto mensual</td><td style="padding:4px 8px"><b>' + formatoRD(datos.presupuestoMin) + ' - ' + formatoRD(datos.presupuestoMax) + '</b></td></tr>' +
      '<tr><td style="padding:4px 8px;color:var(--text-muted)">Clasificación</td><td style="padding:4px 8px"><b>' + (iconos[datos.clasificacion] || '') + ' ' + datos.clasificacion + '</b></td></tr>' +
      '</table></div>' +

      (datos.urlFormularioEmbajador
        ? '<div class="card" style="text-align:center;background:#fff8e6"><h3>🎖️ ¿Conoces a alguien buscando propiedad?</h3>' +
          '<p style="font-size:13px;color:var(--text-muted)">Refiere compradores o inquilinos y gana una comisión por cada uno que cierre — sin ningún costo para ellos.</p>' +
          '<a href="' + datos.urlFormularioEmbajador + '" target="_blank" class="btn btn-outline" style="display:inline-block;text-decoration:none">Hazte Embajador →</a>' +
          '</div>'
        : '') +

      '<p class="footer-note">¿Dudas? Contáctanos por WhatsApp desde el botón flotante.</p>';
  } catch (err) {
    mostrarError('contenido', 'Ocurrió un problema de conexión. Intenta de nuevo en unos minutos.');
  }
}

async function actualizarPortalAlquilerManual() {
  const btn = document.getElementById('btnActualizarPortalAlquiler');
  if (btn) { btn.textContent = '⏳ Actualizando…'; btn.disabled = true; }
  await cargarPortalAlquiler();
}

cargarPortalAlquiler();

function construirTarjetaAgente(perfil, linkWhatsApp) {
  const nombre = perfil ? perfil.nombre : 'Tu agente';
  const idDetalle = 'detalleAgente';
  const estrellas = perfil && perfil.rating ? '⭐'.repeat(Math.round(perfil.rating)) : '';

  const detalle = perfil ? (
    '<div style="text-align:left;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">' +
    (perfil.empresa ? '<p style="font-size:13px;margin:2px 0">🏢 ' + escaparHtml(perfil.empresa) + '</p>' : '') +
    (perfil.especialidad ? '<p style="font-size:13px;margin:2px 0">🎯 Especialidad: ' + escaparHtml(perfil.especialidad) + '</p>' : '') +
    (perfil.anosExperiencia ? '<p style="font-size:13px;margin:2px 0">📅 ' + escaparHtml(perfil.anosExperiencia) + ' de experiencia</p>' : '') +
    (perfil.cierresConfirmados ? '<p style="font-size:13px;margin:2px 0">🏡 ' + perfil.cierresConfirmados + ' propiedades cerradas con éxito</p>' : '') +
    (perfil.satisfaccionPct ? '<p style="font-size:13px;margin:2px 0">😊 ' + perfil.satisfaccionPct + '% de satisfacción de clientes</p>' : '') +
    '</div>'
  ) : '';

  return '<div class="card" style="text-align:center">' +
    '<p style="font-size:14px;margin-bottom:2px">Tu agente: <b>' + escaparHtml(nombre) + '</b>' +
    (perfil && perfil.verificado ? ' <span style="color:#0f7a6b" title="Verificado">✓</span>' : '') + '</p>' +
    (estrellas ? '<p style="margin:2px 0 8px 0">' + estrellas + '</p>' : '') +
    (perfil && perfil.distintivo ? '<p style="font-size:12px;color:#b8860b;margin:0 0 8px 0">🏅 ' + escaparHtml(perfil.distintivo) + '</p>' : '') +
    '<a href="' + linkWhatsApp + '" target="_blank" class="btn" style="background:#25D366;color:white;text-decoration:none;display:inline-block">💬 Contactar a mi agente</a>' +
    (perfil ? '<p style="font-size:12px;color:var(--teal-deep);cursor:pointer;margin-top:8px" onclick="document.getElementById(\'' + idDetalle + '\').style.display = document.getElementById(\'' + idDetalle + '\').style.display === \'none\' ? \'block\' : \'none\'">Ver perfil completo ▾</p>' : '') +
    '<div id="' + idDetalle + '" style="display:none">' + detalle + '</div>' +
    '</div>';
}

function construirHistorialVisitasAlquiler(historial) {
  if (!historial || !historial.length) return '';
  const filas = historial.map(function (v) {
    const fecha = v.fecha ? new Date(v.fecha).toLocaleDateString('es-DO') : '—';
    const opinion = v.miOpinion === 'Sí' ? '👍 Te gustó' : v.miOpinion === 'No' ? '👎 No te gustó' : 'Sin opinión registrada';
    return '<div style="border-bottom:1px solid var(--line);padding:8px 0;font-size:13px">' +
      '<b>Visita ' + v.numero + '</b> — ' + fecha + '<br>' +
      'Agente: ' + (v.agenteNombre || '—') + '<br>' +
      opinion +
      '</div>';
  }).join('');
  return '<div class="card"><h3>📋 Tu historial de visitas</h3>' + filas + '</div>';
}

function construirMiniEncuestaVisitaAlquiler() {
  window.RESPUESTAS_ENCUESTA_VISITA = {};
  return '<div class="card" id="cardEncuestaVisita"><h3>⭐ ¿Cómo fue tu última visita?</h3>' +
    '<p style="font-size:13px;color:var(--text-muted)">Selecciona tus respuestas y presiona enviar — tu agente podrá verlas.</p>' +
    '<div id="preguntasVisita">' +
    construirPreguntaVisitaAlquiler('Inquilino_Confirmo_Visita', '¿Tu agente realmente te visitó la propiedad con esta información?') +
    construirPreguntaVisitaAlquiler('Inquilino_Le_Gusto', '¿Te gustó la propiedad?') +
    construirPreguntaVisitaAlquiler('Agente_Puntual', '¿Tu agente llegó puntual?') +
    construirPreguntaVisitaAlquiler('Agente_Explico_Bien', '¿Explicó bien las opciones?') +
    construirPreguntaVisitaAlquiler('Recomendaria_Agente', '¿Lo recomendarías?') +
    '</div>' +
    '<button class="btn btn-primary" style="width:100%;margin-top:12px" onclick="enviarEncuestaVisitaAlquiler()">📨 Enviar mi opinión</button>' +
    '<p id="mensajeEncuestaVisita" style="font-size:13px;margin-top:8px"></p></div>';
}

function construirPreguntaVisitaAlquiler(campo, pregunta) {
  return '<div id="pregunta_' + campo + '" style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)">' +
    '<span style="font-size:13px">' + pregunta + '</span>' +
    '<span><button class="btn btn-outline btn-sm" id="btnSi_' + campo + '" onclick="seleccionarRespuestaVisita(\'' + campo + '\',\'Sí\')">👍 Sí</button> ' +
    '<button class="btn btn-outline btn-sm" id="btnNo_' + campo + '" onclick="seleccionarRespuestaVisita(\'' + campo + '\',\'No\')">👎 No</button></span></div>';
}

function seleccionarRespuestaVisita(campo, valor) {
  window.RESPUESTAS_ENCUESTA_VISITA[campo] = valor;
  document.getElementById('btnSi_' + campo).className = valor === 'Sí' ? 'btn btn-primary btn-sm' : 'btn btn-outline btn-sm';
  document.getElementById('btnNo_' + campo).className = valor === 'No' ? 'btn btn-primary btn-sm' : 'btn btn-outline btn-sm';
}

function construirConexionesDirectasPendientesAlquiler(lista) {
  if (!lista || !lista.length) return '';
  return '<div class="card"><h3>🏡 Un propietario quiere conectar contigo</h3>' +
    lista.map(c =>
      '<div style="border-bottom:1px solid var(--line);padding:10px 0">' +
      '<p style="font-size:14px"><b>' + escaparHtml(c.tipoInmueble) + '</b> en ' + escaparHtml(c.provincia) + ' - ' + escaparHtml(c.municipio) + ' — RD$' + Number(c.precio).toLocaleString() + '</p>' +
      '<p style="font-size:13px;color:var(--text-muted)">Si aceptas, el propietario recibirá tu contacto y tú recibirás el suyo.</p>' +
      '<button class="btn btn-primary btn-sm" onclick="responderConexionDirectaAlquiler(\'' + c.idConexion + '\', \'Sí\')">✅ Sí, quiero conectar</button> ' +
      '<button class="btn btn-outline btn-sm" onclick="responderConexionDirectaAlquiler(\'' + c.idConexion + '\', \'No\')">No, gracias</button>' +
      '</div>'
    ).join('') + '</div>';
}

async function responderConexionDirectaAlquiler(idConexion, respuesta) {
  try {
    const datos = await ejecutarAccion({ portalAlquiler: window.CODIGO_PORTAL_ALQUILER_ACTUAL, accion: 'responderConexionDirecta', idConexion: idConexion, valor: respuesta });
    alert(datos.mensaje || (datos.error ? 'Ocurrió un problema.' : 'Listo.'));
    location.reload();
  } catch (e) {
    alert('Ocurrió un problema de conexión.');
  }
}

async function confirmarMontoAlquiler(respuesta) {
  const cont = document.getElementById('respuestaMontoAlquiler');
  cont.innerHTML = '<p style="font-size:13px">Enviando…</p>';
  try {
    const datos = await ejecutarAccion({ portalAlquiler: window.CODIGO_PORTAL_ALQUILER_ACTUAL, accion: 'confirmarMontoCierre', idCierre: window.ID_CIERRE_PENDIENTE_ALQUILER, valor: respuesta });
    cont.innerHTML = '<p style="font-size:13px;color:' + (datos.error ? '#e4572e' : '#0f7a6b') + '">' + escaparHtml(datos.mensaje) + '</p>';
  } catch (e) {
    cont.innerHTML = '<p style="font-size:13px;color:#e4572e">⚠️ Ocurrió un problema de conexión.</p>';
  }
}

async function enviarEncuestaVisitaAlquiler() {
  const respuestas = window.RESPUESTAS_ENCUESTA_VISITA || {};
  const msj = document.getElementById('mensajeEncuestaVisita');
  const campos = Object.keys(respuestas);
  if (!campos.length) { msj.textContent = '⚠️ Selecciona al menos una respuesta antes de enviar.'; return; }

  msj.textContent = 'Enviando…';
  try {
    for (const campo of campos) {
      await ejecutarAccion({ portalAlquiler: window.CODIGO_PORTAL_ALQUILER_ACTUAL, accion: 'calificarVisitaAlquiler', campo: campo, valor: respuestas[campo] });
    }
    document.getElementById('cardEncuestaVisita').innerHTML = '<h3>✅ ¡Gracias por tu opinión!</h3><p style="font-size:13px">Tu agente ya puede verla en su Panel.</p>';
  } catch (e) {
    msj.textContent = '⚠️ Ocurrió un problema de conexión. Intenta de nuevo.';
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu Solicitud de Alquiler — PropMatchRD</title>
<link rel="stylesheet" href="styles.css">
<script src="fondo-premium.js" defer></script>
</head>
<body>
<div class="wrap" id="contenido">
  <div class="loading"><div class="spinner"></div>Cargando tu solicitud…</div>
</div>

<script src="app.js"></script>
<script>
(async function () {
  const codigo = obtenerParametro('codigo') || obtenerParametro('portalAlquiler');
  if (!codigo) { mostrarError('contenido', 'Falta tu código de acceso en el enlace.'); return; }
  window.CODIGO_PORTAL_ALQUILER_ACTUAL = codigo;

  try {
    const datos = await llamarApi({ portalAlquiler: codigo });
    if (datos.error) { mostrarError('contenido', datos.mensaje); return; }

    const iconos = { Diamante: '💎', Oro: '🥇', Plata: '🥈', Bronce: '🥉' };

    document.getElementById('contenido').innerHTML =
      '<h1 style="text-align:center">Hola ' + datos.nombre + '</h1>' +
      '<p style="text-align:center;font-family:var(--font-mono);color:var(--text-muted)">Solicitud: ' + datos.idSolicitud + '</p>' +

      '<div class="card" style="text-align:center">' +
      '<h3>' + datos.estadoExplicado + '</h3>' +
      (datos.agenteAsignado ? '<p>Tu agente: <b>' + datos.agenteAsignado + '</b></p>' : '') +
      (datos.agenteLinkWhatsApp
        ? '<p><a href="' + datos.agenteLinkWhatsApp + '" target="_blank" class="btn" style="background:#25D366;color:white;text-decoration:none;display:inline-block">💬 Contactar a mi agente</a></p>'
        : '<p style="font-size:13px;color:var(--text-muted)">Estamos conectándote con el agente más adecuado para ti — en breve verás aquí sus datos de contacto.</p>') +
      '</div>' +

      (datos.calificacionVisitaPendiente ? construirMiniEncuestaVisitaAlquiler() : '') +

      (datos.evaluacion
        ? '<div class="card"><h3>Tu evaluación</h3><p>' + datos.evaluacion + '</p></div>'
        : '') +

      '<div class="card"><h3>Tu búsqueda</h3>' +
      '<table>' +
      '<tr><td style="padding:4px 8px;color:var(--text-muted)">Tipo de inmueble</td><td style="padding:4px 8px"><b>' + datos.tipoInmueble + '</b></td></tr>' +
      '<tr><td style="padding:4px 8px;color:var(--text-muted)">Zona</td><td style="padding:4px 8px"><b>' + datos.provincia + ' - ' + datos.municipio + '</b></td></tr>' +
      '<tr><td style="padding:4px 8px;color:var(--text-muted)">Presupuesto mensual</td><td style="padding:4px 8px"><b>' + formatoRD(datos.presupuestoMin) + ' - ' + formatoRD(datos.presupuestoMax) + '</b></td></tr>' +
      '<tr><td style="padding:4px 8px;color:var(--text-muted)">Clasificación</td><td style="padding:4px 8px"><b>' + (iconos[datos.clasificacion] || '') + ' ' + datos.clasificacion + '</b></td></tr>' +
      '</table></div>' +

      '<p class="footer-note">¿Dudas? Contáctanos por WhatsApp desde el botón flotante.</p>';
  } catch (err) {
    mostrarError('contenido', 'Ocurrió un problema de conexión. Intenta de nuevo en unos minutos.');
  }
})();

function construirMiniEncuestaVisitaAlquiler() {
  window.RESPUESTAS_ENCUESTA_VISITA = {};
  return '<div class="card" id="cardEncuestaVisita"><h3>⭐ ¿Cómo fue tu última visita?</h3>' +
    '<p style="font-size:13px;color:var(--text-muted)">Selecciona tus respuestas y presiona enviar — tu agente podrá verlas.</p>' +
    '<div id="preguntasVisita">' +
    construirPreguntaVisitaAlquiler('Inquilino_Le_Gusto', '¿Te gustó la propiedad?') +
    construirPreguntaVisitaAlquiler('Agente_Puntual', '¿Tu agente llegó puntual?') +
    construirPreguntaVisitaAlquiler('Agente_Explico_Bien', '¿Explicó bien las opciones?') +
    construirPreguntaVisitaAlquiler('Recomendaria_Agente', '¿Lo recomendarías?') +
    '</div>' +
    '<button class="btn btn-primary" style="width:100%;margin-top:12px" onclick="enviarEncuestaVisitaAlquiler()">📨 Enviar mi opinión</button>' +
    '<p id="mensajeEncuestaVisita" style="font-size:13px;margin-top:8px"></p></div>';
}

function construirPreguntaVisitaAlquiler(campo, pregunta) {
  return '<div id="pregunta_' + campo + '" style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)">' +
    '<span style="font-size:13px">' + pregunta + '</span>' +
    '<span><button class="btn btn-outline btn-sm" id="btnSi_' + campo + '" onclick="seleccionarRespuestaVisita(\'' + campo + '\',\'Sí\')">👍 Sí</button> ' +
    '<button class="btn btn-outline btn-sm" id="btnNo_' + campo + '" onclick="seleccionarRespuestaVisita(\'' + campo + '\',\'No\')">👎 No</button></span></div>';
}

function seleccionarRespuestaVisita(campo, valor) {
  window.RESPUESTAS_ENCUESTA_VISITA[campo] = valor;
  document.getElementById('btnSi_' + campo).className = valor === 'Sí' ? 'btn btn-primary btn-sm' : 'btn btn-outline btn-sm';
  document.getElementById('btnNo_' + campo).className = valor === 'No' ? 'btn btn-primary btn-sm' : 'btn btn-outline btn-sm';
}

async function enviarEncuestaVisitaAlquiler() {
  const respuestas = window.RESPUESTAS_ENCUESTA_VISITA || {};
  const msj = document.getElementById('mensajeEncuestaVisita');
  const campos = Object.keys(respuestas);
  if (!campos.length) { msj.textContent = '⚠️ Selecciona al menos una respuesta antes de enviar.'; return; }

  msj.textContent = 'Enviando…';
  try {
    for (const campo of campos) {
      await ejecutarAccion({ portalAlquiler: window.CODIGO_PORTAL_ALQUILER_ACTUAL, accion: 'calificarVisitaAlquiler', campo: campo, valor: respuestas[campo] });
    }
    document.getElementById('cardEncuestaVisita').innerHTML = '<h3>✅ ¡Gracias por tu opinión!</h3><p style="font-size:13px">Tu agente ya puede verla en su Panel.</p>';
  } catch (e) {
    msj.textContent = '⚠️ Ocurrió un problema de conexión. Intenta de nuevo.';
  }
}
</script>
</body>
</html>

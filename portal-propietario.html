<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b5c50">
<link rel="apple-touch-icon" href="icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PropMatchRD">
<title>Tu Propiedad — PropMatchRD</title>
<link rel="stylesheet" href="styles.css">
<script src="fondo-premium.js" defer></script>
</head>
<body>
<div class="wrap" id="contenido"></div>

<script src="app.js"></script>
<script>
  document.getElementById('contenido').innerHTML = construirEsqueletoCarga(2);
async function cargarPortalPropietario() {
  const codigo = obtenerParametro('codigo') || obtenerParametro('portalPropietario');
  window.CODIGO_PORTAL_PROPIETARIO_ACTUAL = codigo;
  if (!codigo) { mostrarError('contenido', 'Falta tu código de acceso en el enlace.'); return; }

  try {
    const datos = await llamarApi({ portalPropietario: codigo });
    if (datos.error) { mostrarError('contenido', datos.mensaje); return; }

    document.getElementById('contenido').innerHTML =
      '<div style="display:flex;justify-content:flex-end"><button id="btnActualizarPortalPropietario" onclick="actualizarPortalPropietarioManual()" style="background:var(--teal);color:white;border:none;border-radius:100px;padding:6px 12px;font-size:12px;cursor:pointer">🔄 Actualizar</button></div>' +
      '<h1 style="text-align:center">Hola ' + escaparHtml(datos.nombre) + '</h1>' +
      '<p style="text-align:center;font-family:var(--font-mono);color:var(--text-muted)">Propiedad: ' + datos.idPropiedad + '</p>' +

      '<div class="card" style="text-align:center">' +
      (datos.verificado ? '<p style="color:#0f7a6b;font-weight:bold">✅ PropMatch Verified Owner</p>' : '') +
      '<h3>' + escaparHtml(datos.estadoExplicado) + '</h3>' +
      (datos.agenteAsignado ? '<p>Tu agente: <b>' + escaparHtml(datos.agenteAsignado) + '</b></p>' : '') +
      (datos.agenteLinkWhatsApp
        ? '<p><a href="' + datos.agenteLinkWhatsApp + '" target="_blank" class="btn" style="background:#25D366;color:white;text-decoration:none;display:inline-block">💬 Contactar a mi agente</a></p>'
        : (datos.modoVenta === 'Yo solo (sin agente)'
            ? '<p style="font-size:13px;color:var(--text-muted)">Estás gestionando esta propiedad de forma independiente.</p>'
            : '<p style="font-size:13px;color:var(--text-muted)">Estamos conectándote con el agente más adecuado — en breve verás aquí sus datos de contacto.</p>')) +
      '</div>' +

      '<div class="card"><h3>🏠 Detalles de tu propiedad</h3>' +
      '<p style="font-size:14px"><b>' + datos.operacion + ':</b> ' + escaparHtml(datos.tipoInmueble) + '</p>' +
      '<p style="font-size:14px">📍 ' + escaparHtml(datos.provincia) + ' - ' + escaparHtml(datos.municipio) + '</p>' +
      '<p style="font-size:14px">💰 RD$' + Number(datos.precio).toLocaleString() + '</p>' +
      '<p style="font-size:14px">🛏️ ' + escaparHtml(datos.habitaciones) + ' hab. · 🚿 ' + escaparHtml(datos.banos) + ' baños · 🚗 ' + escaparHtml(datos.parqueos) + ' parqueo(s)</p>' +
      (datos.descripcion ? '<p style="font-size:13px;color:var(--text-muted)">' + escaparHtml(datos.descripcion) + '</p>' : '') +
      '</div>' +

      '<div class="card"><h3>📊 Análisis de tu propiedad</h3>' +
      '<p style="font-size:14px">' + escaparHtml(datos.analisisPropiedad) + '</p>' +
      '</div>' +

      (datos.compradoresCompatiblesTotal > 0
        ? '<div class="card"><h3>⚡ ' + datos.compradoresCompatiblesTotal + ' comprador(es)/inquilino(s) compatible(s)</h3>' +
          '<p style="font-size:13px;color:var(--text-muted)">Por tu privacidad y la de ellos, no mostramos sus datos de contacto directamente aquí.</p>' +
          Object.entries(datos.compradoresCompatiblesPorClasificacion || {}).sort((a, b) => b[1] - a[1])
            .map(([clasif, cantidad]) => '<p style="font-size:14px">' + cantidad + ' × ' + escaparHtml(clasif) + '</p>').join('') +
          (datos.modoVenta === 'Yo solo (sin agente)'
            ? '<button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="solicitarConexion()">🤝 Solicitar conexión directa (comisión ' + datos.pctComisionConexionDirecta + '% si se concreta)</button>' +
              '<div id="respuestaConexion" style="margin-top:8px"></div>'
            : '') +
          '</div>'
        : '') +

      (datos.modoVenta === 'Yo solo (sin agente)' && datos.solicitudesDeCompradorPendientes && datos.solicitudesDeCompradorPendientes.length
        ? '<div class="card"><h3>🔔 ' + datos.solicitudesDeCompradorPendientes.length + ' comprador(es) quieren conectar contigo</h3>' +
          '<p style="font-size:13px;color:var(--text-muted)">No verás su contacto hasta que aceptes.</p>' +
          datos.solicitudesDeCompradorPendientes.map(s =>
            '<div style="border-bottom:1px solid var(--line);padding:8px 0">' +
            '<p style="font-size:13px;margin:0">Solicitud del ' + s.fecha + '</p>' +
            '<button class="btn btn-primary btn-sm" onclick="responderSolicitudComprador(\'' + s.idConexion + '\', \'Sí\')">✅ Aceptar</button> ' +
            '<button class="btn btn-outline btn-sm" onclick="responderSolicitudComprador(\'' + s.idConexion + '\', \'No\')">Rechazar</button>' +
            '<div id="respSolicitud_' + s.idConexion + '" style="margin-top:4px"></div>' +
            '</div>'
          ).join('') + '</div>'
        : '') +

      (datos.modoVenta === 'Yo solo (sin agente)' && datos.conexionesActivas && datos.conexionesActivas.length
        ? '<div class="card"><h3>✅ Ya conectaste con ' + datos.conexionesActivas.length + ' comprador(es)</h3>' +
          '<p style="font-size:13px;color:var(--text-muted)">Cuando se concrete la venta, repórtala aquí para calcular la comisión.</p>' +
          datos.conexionesActivas.map(c =>
            '<div style="border-bottom:1px solid var(--line);padding:8px 0">' +
            '<input type="number" id="monto_' + c.idConexion + '" placeholder="Monto final de venta (RD$)" style="width:100%;margin-bottom:6px">' +
            '<button class="btn btn-primary btn-sm" onclick="reportarVenta(\'' + c.idConexion + '\')">✅ Reportar venta concretada</button>' +
            '<div id="respuestaVenta_' + c.idConexion + '" style="margin-top:6px"></div>' +
            '</div>'
          ).join('') +
          '</div>'
        : '') +
      '';

  } catch (err) {
    mostrarError('contenido', 'Ocurrió un problema de conexión. Intenta de nuevo en unos minutos.');
  }
}

async function actualizarPortalPropietarioManual() {
  const btn = document.getElementById('btnActualizarPortalPropietario');
  if (btn) { btn.textContent = '⏳ Actualizando…'; btn.disabled = true; }
  await cargarPortalPropietario();
}

cargarPortalPropietario();

async function responderSolicitudComprador(idConexion, respuesta) {
  const cont = document.getElementById('respSolicitud_' + idConexion);
  cont.innerHTML = '<span style="font-size:13px">Enviando…</span>';
  try {
    const datos = await ejecutarAccion({ portalPropietario: window.CODIGO_PORTAL_PROPIETARIO_ACTUAL, accion: 'responderConexionDirectaPropietario', idConexion: idConexion, valor: respuesta });
    cont.innerHTML = '<span style="font-size:13px;color:' + (datos.error ? '#e4572e' : '#0f7a6b') + '">' + escaparHtml(datos.mensaje) + '</span>';
  } catch (e) {
    cont.innerHTML = '<span style="font-size:13px;color:#e4572e">⚠️ Ocurrió un problema de conexión.</span>';
  }
}

async function solicitarConexion() {
  const cont = document.getElementById('respuestaConexion');
  cont.innerHTML = '<p style="font-size:13px">Enviando…</p>';
  try {
    const datos = await ejecutarAccion({ portalPropietario: window.CODIGO_PORTAL_PROPIETARIO_ACTUAL, accion: 'solicitarConexionDirecta' });
    cont.innerHTML = '<p style="font-size:13px;color:' + (datos.error ? '#e4572e' : '#0f7a6b') + '">' + escaparHtml(datos.mensaje) + '</p>';
  } catch (e) {
    cont.innerHTML = '<p style="font-size:13px;color:#e4572e">⚠️ Ocurrió un problema de conexión.</p>';
  }
}

async function reportarVenta(idConexion) {
  const monto = document.getElementById('monto_' + idConexion).value;
  const cont = document.getElementById('respuestaVenta_' + idConexion);
  if (!monto || Number(monto) <= 0) { cont.innerHTML = '<p style="font-size:13px;color:#e4572e">⚠️ Ingresa un monto válido.</p>'; return; }
  cont.innerHTML = '<p style="font-size:13px">Procesando…</p>';
  try {
    const datos = await ejecutarAccion({ portalPropietario: window.CODIGO_PORTAL_PROPIETARIO_ACTUAL, accion: 'reportarVentaConexionDirecta', idConexion: idConexion, montoVenta: monto });
    if (datos.error) { cont.innerHTML = '<p style="font-size:13px;color:#e4572e">⚠️ ' + escaparHtml(datos.mensaje) + '</p>'; return; }
    cont.innerHTML = '<div style="background:var(--sand-deep);padding:10px;border-radius:8px;font-size:13px">' + escaparHtml(datos.mensaje) + '<br><br>' +
      'Cuenta para pagar: <b>' + escaparHtml(datos.cuentaPlataforma || '') + '</b><br>' +
      '<span style="color:#c0392b">⚠️ Escribe esta referencia en el concepto de tu transferencia: <b>' + escaparHtml(datos.referenciaPago || '') + '</b></span>' +
      (datos.urlQrPago ? '<br><img src="' + escaparHtml(datos.urlQrPago) + '" alt="Código QR de pago" style="max-width:160px;margin-top:8px">' : '') + '<br>' +
      '<button class="btn btn-primary btn-sm" style="margin-top:8px" onclick="reportarPago(\'' + idConexion + '\')">Ya transferí, reportar pago</button></div>';
  } catch (e) {
    cont.innerHTML = '<p style="font-size:13px;color:#e4572e">⚠️ Ocurrió un problema de conexión.</p>';
  }
}

async function reportarPago(idConexion) {
  try {
    const datos = await ejecutarAccion({ portalPropietario: window.CODIGO_PORTAL_PROPIETARIO_ACTUAL, accion: 'reportarPagoConexionDirecta', idConexion: idConexion });
    alert(datos.mensaje || 'Gracias, verificaremos tu pago.');
  } catch (e) {
    alert('Ocurrió un problema de conexión.');
  }
}
</script>
</body>
</html>

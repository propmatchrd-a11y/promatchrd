<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu análisis — PropMatchRD</title>
<link rel="stylesheet" href="styles.css">
<script src="fondo-premium.js" defer></script>
</head>
<body>
<div class="wrap" id="contenido"></div>

<script src="app.js"></script>
<script>
  document.getElementById('contenido').innerHTML = construirEsqueletoCarga(2);
async function cargarPortalComprador() {
  const codigo = obtenerParametro('codigo') || obtenerParametro('portal');
  if (!codigo) { mostrarError('contenido', 'Falta tu código de acceso en el enlace.'); return; }

  try {
    const datos = await llamarApi({ portal: codigo });
    if (datos.error) { mostrarError('contenido', datos.mensaje); return; }
    guardarCodigoRecordado('comprador', codigo); // automatización: la próxima vez, index.html ya lo recuerda
    window.ID_CIERRE_PENDIENTE = datos.montoCierrePendiente ? datos.montoCierrePendiente.idCierre : null;

    const g = datos.gastos || {};
    const documentos = datos.documentos || {};
    document.getElementById('contenido').innerHTML =
      '<div style="text-align:center">' + construirBadgeClasificacion(datos.clasificacion) + '</div>' +
      '<div style="display:flex;justify-content:flex-end"><button id="btnActualizarPortal" onclick="actualizarPortalManual()" style="background:var(--teal);color:white;border:none;border-radius:100px;padding:6px 12px;font-size:12px;cursor:pointer">🔄 Actualizar</button></div>' +
      '<h1>Hola ' + escaparHtml(datos.nombre) + '</h1>' +

      '<div class="alert info"><b>Estado:</b> ' + datos.estadoExplicado + '</div>' +

      (datos.agenteLinkWhatsApp
        ? construirTarjetaAgente(datos.agentePerfil, datos.agenteLinkWhatsApp)
        : '<div class="alert info" style="text-align:center">Estamos conectándote con el agente más adecuado para ti — en breve verás aquí sus datos de contacto.</div>') +

      (datos.resumenCompatibilidad
        ? '<div class="card" style="text-align:center;background:var(--sand)"><div style="font-size:28px">' + datos.resumenCompatibilidad.emoji + '</div>' +
          '<div style="font-size:17px;font-weight:bold;margin:4px 0">Compatibilidad ' + datos.resumenCompatibilidad.nivel + '</div>' +
          '<p style="font-size:14px;color:var(--ink-soft);margin:0">' + escaparHtml(datos.resumenCompatibilidad.resumen) + '</p></div>'
        : '') +

      (datos.montoCierrePendiente
        ? '<div class="card" style="text-align:center;background:#fff3cd"><h3>💰 Tu agente reportó un cierre</h3>' +
          '<p style="font-size:15px;margin:6px 0">Monto reportado: <b>RD$' + Number(datos.montoCierrePendiente.montoVenta).toLocaleString('es-DO') + '</b></p>' +
          '<p style="font-size:13px;color:var(--text-muted)">¿Es correcto este monto?</p>' +
          '<button class="btn btn-primary" onclick="confirmarMonto(\'Sí\')">✅ Sí, es correcto</button> ' +
          '<button class="btn btn-outline" onclick="confirmarMonto(\'No\')">❌ No es correcto</button>' +
          '<div id="respuestaMonto" style="margin-top:8px"></div></div>'
        : '') +

      (datos.confirmarCierrePendiente
        ? '<div class="card" style="text-align:center"><h3>👋 ¿Llegaste a comprar tu propiedad?</h3>' +
          '<p style="font-size:14px;color:var(--text-muted)">Toma 10 segundos y nos ayuda muchísimo a mejorar.</p>' +
          '<button class="btn btn-primary" onclick="confirmarCierre(\'Sí\')">✅ Sí, ya cerré</button> ' +
          '<button class="btn btn-outline" onclick="confirmarCierre(\'No\')">Todavía no</button>' +
          '<div id="respuestaCierre" style="margin-top:8px"></div></div>'
        : '') +

      (datos.propiedadesCompatibles && datos.propiedadesCompatibles.length
        ? '<div class="card"><h3>🏡 Propiedades compatibles (propietarios directos, sin agente)</h3>' +
          datos.propiedadesCompatibles.map(p => construirTarjetaPropiedadCompatible(p)).join('') +
          '</div>'
        : '') +

      '<div class="card"><p style="font-size:15px;color:var(--ink);margin:0">' + datos.analisisPersonalizado + '</p></div>' +

      '<div class="card" style="text-align:center">' +
      '<div style="display:flex;justify-content:center;gap:24px;flex-wrap:wrap">' +
      '<div>' + construirGraficoGauge(datos.indicePreparacionPct, '#0f7a6b', 110) + '<div style="font-size:13px;color:var(--text-muted);margin-top:6px">Índice de Preparación<br>' + datos.indicePreparacionPct + '/100</div></div>' +
      '<div>' + construirGraficoGauge(datos.probabilidadFinanciamientoPct, '#e4572e', 110) + '<div style="font-size:13px;color:var(--text-muted);margin-top:6px">Probabilidad de Financiamiento<br>' + datos.probabilidadFinanciamientoPct + '/100</div></div>' +
      '</div></div>' +

      '<div class="card"><h3>Tu Ruta de Compra</h3><div class="ruta">' +
      construirRutaHtml(datos.etapaRutaCompra, datos.etapasRutaCompra) + '</div></div>' +

      '<div class="card"><h3>💰 Gastos a considerar (más allá del precio)</h3><table>' +
      '<tr><td>Inicial (aprox.)</td><td class="num">' + formatoRD(g.inicial) + '</td></tr>' +
      '<tr><td>Transferencia</td><td class="num">' + formatoRD(g.transferencia) + '</td></tr>' +
      '<tr><td>Seguro (mensual)</td><td class="num">' + formatoRD(g.seguroMin) + ' - ' + formatoRD(g.seguroMax) + '</td></tr>' +
      '<tr><td>Tasación</td><td class="num">' + formatoRD(g.tasacionMin) + ' - ' + formatoRD(g.tasacionMax) + '</td></tr>' +
      '<tr><td>Gastos de cierre</td><td class="num">' + formatoRD(g.cierreMin) + ' - ' + formatoRD(g.cierreMax) + '</td></tr>' +
      '<tr><td>IPI (anual)</td><td class="num">' + (g.aplicaIPI ? formatoRD(g.ipiAnual) : 'No aplica') + '</td></tr>' +
      '<tr><td style="font-weight:700">Total estimado para iniciar</td><td class="num" style="font-weight:700">' + formatoRD(g.totalMin) + ' - ' + formatoRD(g.totalMax) + '</td></tr>' +
      '</table><p style="font-size:13px;margin-top:8px">Estimados de referencia — confirma cifras con tu banco y abogado.</p></div>' +

      (datos.faltantes.length
        ? '<div class="card"><h3>¿Qué sigue?</h3><ul>' + datos.faltantes.map(f => '<li>' + f + '</li>').join('') + '</ul></div>'
        : '<div class="alert success">Tu perfil está completo — tu agente te contactará pronto.</div>') +

      (datos.alertaPresupuesto ? '<div class="alert">' + datos.alertaPresupuesto + '</div>' : '') +
      (datos.graficoPresupuesto && (datos.graficoPresupuesto.mercadoMin || datos.graficoPresupuesto.mercadoMax)
        ? '<div class="card"><h3>💰 Tu presupuesto vs. el mercado</h3>' + construirGraficoPresupuesto(datos.graficoPresupuesto) + '</div>'
        : '') +

      (datos.certificadoUrl ? '<p style="text-align:center"><a class="btn btn-primary" href="' + datos.certificadoUrl + '">📄 Ver mi Certificado</a></p>' : '') +

      '<div class="card"><h3>📄 Centro de Documentos</h3>' +
      '<p style="font-size:13px">Marca lo que ya tienes listo — tu agente lo verá automáticamente.</p>' +
      construirFilaDocumento('cedula', 'Doc_Cedula', 'Cédula', documentos.cedula) +
      construirFilaDocumento('cartaTrabajo', 'Doc_Carta_Trabajo', 'Carta de trabajo', documentos.cartaTrabajo) +
      construirFilaDocumento('estadosCuenta', 'Doc_Estados_Cuenta', 'Estados de cuenta', documentos.estadosCuenta) +
      '</div>' +

      (datos.calificacionVisitaPendiente ? construirMiniEncuestaVisita() : '') +
      construirLineaDeTiempo(datos.etapaRutaCompra, (datos.historialVisitas || []).length) +
      construirHistorialVisitas(datos.historialVisitas) +
      construirConexionesDirectasPendientes(datos.conexionesDirectasPendientes) +

      '<div class="card"><h3>🆘 ¿Necesitas algo?</h3>' +
      '<p style="font-size:13px">Un clic y avisamos a tu agente — sin necesidad de llamar.</p>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      construirBotonAyuda('Tengo dudas') + construirBotonAyuda('Quiero cambiar de zona') +
      construirBotonAyuda('Quiero cambiar de agente') + construirBotonAyuda('Quiero reagendar') +
      '</div><p id="mensajeAyuda" style="font-size:13px;margin-top:8px"></p></div>' +

      '<div class="card"><h3>💡 Mientras esperas</h3>' +
      '<ul style="font-size:13px">' +
      '<li>5 errores comunes al comprar tu primera propiedad: no verificar el título, no calcular todos los gastos de cierre, negociar sin preaprobación, saltarse la tasación, y firmar sin un abogado independiente.</li>' +
      '<li>Documentos que casi siempre te van a pedir: cédula, carta de trabajo o estados de cuenta, y comprobante de la inicial.</li>' +
      '<li>Mejorar tus posibilidades de aprobación: mantén tus estados de cuenta organizados, evita nuevas deudas mientras tramitas, y ten tu inicial disponible y documentada.</li>' +
      '</ul></div>' +

      '<div class="card"><h3>⚙️ Mi información</h3>' +
      '<p style="font-size:13px">Actualiza tus datos de contacto si cambiaron.</p>' +
      '<label style="font-size:13px">Teléfono</label>' +
      '<div class="code-input"><input type="text" id="inputTelefono" value="' + datos.telefono + '">' +
      '<button class="btn btn-outline btn-sm" onclick="guardarCampo(\'actualizarTelefono\',\'inputTelefono\')">💾 Guardar</button></div>' +
      '<label style="font-size:13px;margin-top:10px;display:block">Correo</label>' +
      '<div class="code-input"><input type="text" id="inputEmail" value="' + datos.email + '">' +
      '<button class="btn btn-outline btn-sm" onclick="guardarCampo(\'actualizarEmail\',\'inputEmail\')">💾 Guardar</button></div>' +
      '<p id="mensajeGuardado" style="font-size:13px;margin-top:8px"></p></div>' +

      '<p class="footer-note">Código: ' + datos.idComprador + '</p>';

    window.CODIGO_PORTAL_ACTUAL = codigo;
  } catch (err) {
    mostrarError('contenido', 'Ocurrió un problema de conexión. Intenta de nuevo en unos minutos.');
  }
}

async function actualizarPortalManual() {
  const btn = document.getElementById('btnActualizarPortal');
  if (btn) { btn.textContent = '⏳ Actualizando…'; btn.disabled = true; }
  await cargarPortalComprador();
}

cargarPortalComprador();

function construirFilaDocumento(idSufijo, campo, etiqueta, marcado) {
  return '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)">' +
    '<input type="checkbox" id="doc_' + idSufijo + '" ' + (marcado ? 'checked' : '') +
    ' onchange="actualizarDocumento(\'' + campo + '\', this.checked)" style="width:18px;height:18px">' +
    '<label for="doc_' + idSufijo + '" style="font-size:13px">' + etiqueta + '</label></div>';
}

async function actualizarDocumento(campo, marcado) {
  await ejecutarAccion({ portal: window.CODIGO_PORTAL_ACTUAL, accion: 'actualizarDocumento', campo: campo, valor: marcado ? 'Sí' : 'No' });
}

/**
 * Tarjeta desplegable del agente asignado — compacta por defecto (nombre
 * + WhatsApp, lo que la mayoría solo necesita), con un "Ver más" que
 * expande su perfil completo (empresa, especialidad, experiencia,
 * cierres, calificación) para generar más confianza sin abrumar a quien
 * solo quiere escribirle rápido.
 */
function construirTarjetaAgente(perfil, linkWhatsApp) {
  const nombre = perfil ? perfil.nombre : 'Tu agente';
  const idDetalle = 'detalleAgente';
  const estrellas = perfil && perfil.rating ? '⭐'.repeat(Math.round(perfil.rating)) : '';

  const detalle = perfil ? (
    '<div style="text-align:left;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">' +
    (perfil.empresa ? '<p style="font-size:13px;margin:2px 0">🏢 ' + escaparHtml(perfil.empresa) + '</p>' : '') +
    (perfil.especialidad ? '<p style="font-size:13px;margin:2px 0">🎯 Especialidad: ' + escaparHtml(perfil.especialidad) + '</p>' : '') +
    (perfil.anosExperiencia ? '<p style="font-size:13px;margin:2px 0">📅 ' + escaparHtml(perfil.anosExperiencia) + ' de experiencia</p>' : '') +
    (perfil.cierresConfirmados ? '<p style="font-size:13px;margin:2px 0">🏡 ' + perfil.cierresConfirmados + ' propiedades cerradas con éxito</p>' : '') +
    (perfil.satisfaccionPct ? '<p style="font-size:13px;margin:2px 0">😊 ' + perfil.satisfaccionPct + '% de satisfacción de clientes</p>' : '') +
    '</div>'
  ) : '';

  return '<div class="card" style="text-align:center">' +
    '<p style="font-size:14px;margin-bottom:2px">Tu agente: <b>' + escaparHtml(nombre) + '</b>' +
    (perfil && perfil.verificado ? ' <span style="color:#0f7a6b" title="Verificado">✓</span>' : '') + '</p>' +
    (estrellas ? '<p style="margin:2px 0 8px 0">' + estrellas + '</p>' : '') +
    (perfil && perfil.distintivo ? '<p style="font-size:12px;color:#b8860b;margin:0 0 8px 0">🏅 ' + escaparHtml(perfil.distintivo) + '</p>' : '') +
    '<a href="' + linkWhatsApp + '" target="_blank" class="btn" style="background:#25D366;color:white;text-decoration:none;display:inline-block">💬 Contactar a mi agente</a>' +
    (perfil ? '<p style="font-size:12px;color:var(--teal-deep);cursor:pointer;margin-top:8px" onclick="document.getElementById(\'' + idDetalle + '\').style.display = document.getElementById(\'' + idDetalle + '\').style.display === \'none\' ? \'block\' : \'none\'">Ver perfil completo ▾</p>' : '') +
    '<div id="' + idDetalle + '" style="display:none">' + detalle + '</div>' +
    '</div>';
}

function construirLineaDeTiempo(etapaRutaCompra, totalVisitas) {
  const etapasVisibles = ['Registrado', 'Asignado', 'Visitando', 'Reservado', 'Cerrado'];
  const mapaEtapas = {
    'Evaluación': 0, 'Comprador Verificado': 0,
    'Agente Asignado': 1,
    'Visita 1': 2, 'Nueva búsqueda': 2, 'Visita 2+': 2,
    'Reserva': 3,
    'Compra': 4
  };
  const etapaActualIdx = mapaEtapas[etapaRutaCompra] !== undefined ? mapaEtapas[etapaRutaCompra] : 0;

  const pasos = etapasVisibles.map(function (etapa, i) {
    const completado = i < etapaActualIdx;
    const actual = i === etapaActualIdx;
    const color = completado ? '#0f7a6b' : (actual ? '#1a73e8' : '#d8d2c2');
    const icono = completado ? '✓' : (i + 1);
    return '<div style="display:flex;flex-direction:column;align-items:center;flex:1">' +
      '<div style="width:28px;height:28px;border-radius:50%;background:' + color + ';color:white;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold">' + icono + '</div>' +
      '<span style="font-size:11px;margin-top:4px;text-align:center;color:' + (actual ? '#1a73e8' : '#8a8272') + ';font-weight:' + (actual ? 'bold' : 'normal') + '">' + etapa + '</span>' +
      '</div>';
  }).join('<div style="flex:0.4;height:2px;background:#d8d2c2;margin-top:14px"></div>');

  return '<div class="card"><h3>🗺️ Tu progreso</h3>' +
    '<div style="display:flex;align-items:flex-start;margin-top:8px">' + pasos + '</div>' +
    (totalVisitas ? '<p style="font-size:12px;color:var(--text-muted);text-align:center;margin-top:8px">' + totalVisitas + ' visita(s) realizada(s)</p>' : '') +
    '</div>';
}

function construirHistorialVisitas(historial) {
  if (!historial || !historial.length) return '';
  const filas = historial.map(function (v) {
    const fecha = v.fecha ? new Date(v.fecha).toLocaleDateString('es-DO') : '—';
    const opinion = v.miOpinion === 'Sí' ? '👍 Te gustó' : v.miOpinion === 'No' ? '👎 No te gustó' : 'Sin opinión registrada';
    return '<div style="border-bottom:1px solid var(--line);padding:8px 0;font-size:13px">' +
      '<b>Visita ' + v.numero + '</b> — ' + fecha + '<br>' +
      'Agente: ' + (v.agenteNombre || '—') + (v.resultado ? ' · ' + v.resultado : '') + '<br>' +
      opinion +
      '</div>';
  }).join('');
  return '<div class="card"><h3>📋 Tu historial de visitas</h3>' + filas + '</div>';
}

function construirMiniEncuestaVisita() {
  window.RESPUESTAS_ENCUESTA_VISITA = {};
  return '<div class="card" id="cardEncuestaVisita"><h3>⭐ ¿Cómo fue tu última visita?</h3>' +
    '<p style="font-size:13px;color:var(--text-muted)">Selecciona tus respuestas y presiona enviar — tu agente podrá verlas.</p>' +
    '<div id="preguntasVisita">' +
    construirPreguntaVisita('Comprador_Confirmo_Visita', '¿Tu agente realmente te visitó la propiedad con esta información?') +
    construirPreguntaVisita('Comprador_Le_Gusto', '¿Te gustó la propiedad?') +
    construirPreguntaVisita('Agente_Puntual', '¿Tu agente llegó puntual?') +
    construirPreguntaVisita('Agente_Explico_Bien', '¿Explicó bien las opciones?') +
    construirPreguntaVisita('Recomendaria_Agente', '¿Lo recomendarías?') +
    '</div>' +
    '<button class="btn btn-primary" style="width:100%;margin-top:12px" onclick="enviarEncuestaVisita()">📨 Enviar mi opinión</button>' +
    '<p id="mensajeEncuestaVisita" style="font-size:13px;margin-top:8px"></p></div>';
}

function construirPreguntaVisita(campo, pregunta) {
  return '<div id="pregunta_' + campo + '" style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)">' +
    '<span style="font-size:13px">' + pregunta + '</span>' +
    '<span><button class="btn btn-outline btn-sm" id="btnSi_' + campo + '" onclick="seleccionarRespuestaVisita(\'' + campo + '\',\'Sí\')">👍 Sí</button> ' +
    '<button class="btn btn-outline btn-sm" id="btnNo_' + campo + '" onclick="seleccionarRespuestaVisita(\'' + campo + '\',\'No\')">👎 No</button></span></div>';
}

function seleccionarRespuestaVisita(campo, valor) {
  window.RESPUESTAS_ENCUESTA_VISITA[campo] = valor;
  document.getElementById('btnSi_' + campo).className = valor === 'Sí' ? 'btn btn-primary btn-sm' : 'btn btn-outline btn-sm';
  document.getElementById('btnNo_' + campo).className = valor === 'No' ? 'btn btn-primary btn-sm' : 'btn btn-outline btn-sm';
}

function construirConexionesDirectasPendientes(lista) {
  if (!lista || !lista.length) return '';
  return '<div class="card"><h3>🏡 Un propietario quiere conectar contigo</h3>' +
    lista.map(c =>
      '<div style="border-bottom:1px solid var(--line);padding:10px 0">' +
      '<p style="font-size:14px"><b>' + escaparHtml(c.tipoInmueble) + '</b> en ' + escaparHtml(c.provincia) + ' - ' + escaparHtml(c.municipio) + ' — RD$' + Number(c.precio).toLocaleString() + '</p>' +
      '<p style="font-size:13px;color:var(--text-muted)">Si aceptas, el propietario recibirá tu contacto y tú recibirás el suyo.</p>' +
      '<button class="btn btn-primary btn-sm" onclick="responderConexionDirecta(\'' + c.idConexion + '\', \'Sí\')">✅ Sí, quiero conectar</button> ' +
      '<button class="btn btn-outline btn-sm" onclick="responderConexionDirecta(\'' + c.idConexion + '\', \'No\')">No, gracias</button>' +
      '</div>'
    ).join('') + '</div>';
}

function construirTarjetaPropiedadCompatible(p) {
  const estado = p.conexion ? p.conexion.estado : null;
  let accionHtml;
  if (!estado) {
    accionHtml = '<button class="btn btn-primary btn-sm" onclick="solicitarConexionComprador(\'' + p.id + '\')">🤝 Solicitar conexión</button>';
  } else if (estado === 'Pendiente_Respuesta_Propietario') {
    accionHtml = '<span style="font-size:13px;color:var(--text-muted)">⏳ Esperando respuesta del propietario…</span>';
  } else if (estado === 'Rechazada_Por_Propietario') {
    accionHtml = '<span style="font-size:13px;color:var(--text-muted)">El propietario no aceptó conectar esta vez.</span>';
  } else if (estado === 'Conectados') {
    accionHtml = '<span style="font-size:13px;color:#0f7a6b">✅ Conectados — revisa tu correo para el contacto.</span> ' +
      '<button class="btn btn-outline btn-sm" onclick="registrarVisitaComprador(\'' + p.conexion.idConexion + '\')">📍 Marcar que la visité</button>';
  } else {
    accionHtml = '';
  }
  return '<div style="border-bottom:1px solid var(--line);padding:10px 0">' +
    '<p style="font-size:14px;margin:0"><b>' + escaparHtml(p.tipo) + '</b> en ' + escaparHtml(p.provincia) + ' - ' + escaparHtml(p.municipio) + '</p>' +
    '<p style="font-size:14px;margin:2px 0;color:#b8860b"><b>RD$' + Number(p.precio).toLocaleString('es-DO') + '</b> · ' + (p.habitaciones || '—') + ' hab · ' + (p.banos || '—') + ' baños</p>' +
    (p.descripcion ? '<p style="font-size:13px;color:var(--text-muted);margin:2px 0">' + escaparHtml(p.descripcion) + '</p>' : '') +
    '<div id="conex_' + p.id + '" style="margin-top:6px">' + accionHtml + '</div>' +
    '</div>';
}

async function solicitarConexionComprador(idPropiedad) {
  const cont = document.getElementById('conex_' + idPropiedad);
  cont.innerHTML = '<span style="font-size:13px">Enviando…</span>';
  try {
    const datos = await ejecutarAccion({ portal: window.CODIGO_PORTAL_ACTUAL, accion: 'solicitarConexionComprador', idPropiedad: idPropiedad });
    cont.innerHTML = '<span style="font-size:13px;color:' + (datos.error ? '#e4572e' : '#0f7a6b') + '">' + escaparHtml(datos.mensaje) + '</span>';
  } catch (e) {
    cont.innerHTML = '<span style="font-size:13px;color:#e4572e">⚠️ Ocurrió un problema de conexión.</span>';
  }
}

async function registrarVisitaComprador(idConexion) {
  try {
    const datos = await ejecutarAccion({ portal: window.CODIGO_PORTAL_ACTUAL, accion: 'registrarVisitaConexionDirecta', idConexion: idConexion });
    alert(datos.mensaje || 'Registrado.');
  } catch (e) {
    alert('Ocurrió un problema de conexión.');
  }
}

async function confirmarMonto(respuesta) {
  const cont = document.getElementById('respuestaMonto');
  cont.innerHTML = '<p style="font-size:13px">Enviando…</p>';
  try {
    const datos = await ejecutarAccion({ portal: window.CODIGO_PORTAL_ACTUAL, accion: 'confirmarMontoCierre', idCierre: window.ID_CIERRE_PENDIENTE, valor: respuesta });
    cont.innerHTML = '<p style="font-size:13px;color:' + (datos.error ? '#e4572e' : '#0f7a6b') + '">' + escaparHtml(datos.mensaje) + '</p>';
  } catch (e) {
    cont.innerHTML = '<p style="font-size:13px;color:#e4572e">⚠️ Ocurrió un problema de conexión.</p>';
  }
}

async function responderConexionDirecta(idConexion, respuesta) {
  try {
    const datos = await ejecutarAccion({ portal: window.CODIGO_PORTAL_ACTUAL, accion: 'responderConexionDirecta', idConexion: idConexion, valor: respuesta });
    alert(datos.mensaje || (datos.error ? 'Ocurrió un problema.' : 'Listo.'));
    location.reload();
  } catch (e) {
    alert('Ocurrió un problema de conexión.');
  }
}

async function enviarEncuestaVisita() {
  const respuestas = window.RESPUESTAS_ENCUESTA_VISITA || {};
  const msj = document.getElementById('mensajeEncuestaVisita');
  const campos = Object.keys(respuestas);
  if (!campos.length) { msj.textContent = '⚠️ Selecciona al menos una respuesta antes de enviar.'; return; }

  msj.textContent = 'Enviando…';
  try {
    for (const campo of campos) {
      await ejecutarAccion({ portal: window.CODIGO_PORTAL_ACTUAL, accion: 'calificarVisita', campo: campo, valor: respuestas[campo] });
    }
    // Si dijo que NO recomendaría a su agente, se le ofrece de inmediato
    // la opción de reasignación — regla simple, no depende de IA.
    if (respuestas['Recomendaria_Agente'] === 'No') {
      document.getElementById('cardEncuestaVisita').innerHTML =
        '<h3>Gracias por tu opinión</h3>' +
        '<p style="font-size:13px">¿Quieres que te asignemos con otro agente?</p>' +
        '<button class="btn btn-primary btn-sm" onclick="solicitarReasignacion()">Sí, asígnenme otro agente</button> ' +
        '<button class="btn btn-outline btn-sm" onclick="document.getElementById(\'cardEncuestaVisita\').innerHTML=\'<h3>✅ Listo</h3><p style=\\\'font-size:13px\\\'>Seguirás con tu agente actual.</p>\'">No, gracias</button>' +
        '<p id="mensajeReasignacion" style="font-size:13px;margin-top:8px"></p>';
    } else {
      document.getElementById('cardEncuestaVisita').innerHTML = '<h3>✅ ¡Gracias por tu opinión!</h3><p style="font-size:13px">Tu agente ya puede verla en su Panel.</p>';
    }
  } catch (e) {
    msj.textContent = '⚠️ Ocurrió un problema de conexión. Intenta de nuevo.';
  }
}

async function solicitarReasignacion() {
  const msj = document.getElementById('mensajeReasignacion');
  msj.textContent = 'Buscando otro agente…';
  try {
    const datos = await ejecutarAccion({ portal: window.CODIGO_PORTAL_ACTUAL, accion: 'solicitarReasignacion' });
    msj.textContent = datos.error ? '⚠️ ' + datos.mensaje : '✅ ' + datos.mensaje;
  } catch (e) {
    msj.textContent = '⚠️ Ocurrió un problema de conexión.';
  }
}

function construirBotonAyuda(tipo) {
  return '<button class="btn btn-outline btn-sm" onclick="solicitarAyuda(\'' + tipo + '\')">' + tipo + '</button>';
}

async function solicitarAyuda(tipo) {
  const msj = document.getElementById('mensajeAyuda');
  msj.textContent = 'Enviando…';
  try {
    await ejecutarAccion({ portal: window.CODIGO_PORTAL_ACTUAL, accion: 'solicitarAyuda', valor: tipo });
    msj.textContent = '✅ Le avisamos a tu agente. Te contactará pronto.';
  } catch (e) {
    msj.textContent = '⚠️ No se pudo enviar. Intenta de nuevo.';
  }
}

async function guardarCampo(accion, inputId) {
  const valor = document.getElementById(inputId).value.trim();
  if (!valor) return;
  const msj = document.getElementById('mensajeGuardado');
  msj.textContent = 'Guardando…';
  try {
    const resultado = await ejecutarAccion({ portal: window.CODIGO_PORTAL_ACTUAL, accion: accion, valor: valor });
    msj.textContent = resultado.error ? '⚠️ ' + resultado.mensaje : '✅ Guardado.';
  } catch (e) {
    msj.textContent = '⚠️ No se pudo guardar. Intenta de nuevo.';
  }
}
